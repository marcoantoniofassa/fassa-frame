<!-- Shattered glass. For a broken-screen joke: glass cracks at x/y and the shards fly and fall, with a short flash and shake. -->

<template id="shattered-glass-template">
<style>

</div>
<script>
(function () {
  const C = (window.__scenes || {})["shattered-glass"] || { duration: 3.0 };
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  var D = C.duration || 3.0, t0 = 0;

  var P = {
    x: 540, // Glass-break center on the 1080×1920 canvas, in pixels.
    y: 820, // Glass-break point, in pixels.
    size: 1200, // Glass width, in pixels; cracks cover most of it. A width of 1080–1600 covers the screen.
  };


  var pe = function (s) { return document.getElementById("shatteredglass-" + s); };
  var TW = Math.max(500, Number(P.size) || 1200), TH = TW * 1280 / 720;
  var vv = pe("v"); vv.style.left = (P.x - .55 * TW) + "px"; vv.style.top = (P.y - .49 * TH) + "px"; vv.style.width = TW + "px"; vv.style.height = TH + "px";
  pe("fl").style.background = "radial-gradient(circle " + Math.round(TW * .55) + "px at " + P.x + "px " + P.y + "px,rgba(255,255,255,.95),rgba(255,255,255,.35) 40%,rgba(255,255,255,0) 100%)";
  var bang = t0 + .5, videoEnd = t0 + Math.min(D, 3.9), exit = videoEnd - .3;
  tl.fromTo(vv, { opacity: 0 }, { opacity: 1, duration: .04, ease: "none" }, t0 + .05);
  tl.fromTo(pe("fl"), { opacity: 0 }, { opacity: .9, duration: .03, ease: "none" }, bang);
  tl.to(pe("fl"), { opacity: 0, duration: .28, ease: "power2.out", immediateRender: false }, bang + .04);
  tl.to(vv, { opacity: 0, duration: .3, ease: "power2.in", immediateRender: false }, exit);

  var TX = [1, -.82, .64, -.9, .5, -.6, .42, -.3, .2], TY = [-.7, .9, -.6, .5, -.72, .4, -.3, .22, -.1];
  var FQ = 1 / 30, q0 = Math.ceil((bang + FQ / 4) * 30 - .001), en = q0 * FQ - FQ / 4, nq = 9, pk = 18, ax = 0, ay = 0;
  tl.fromTo(pe("tr"), { opacity: 0 }, { opacity: 1, duration: FQ / 8, ease: "none" }, en);
  for (var kq = 0; kq <= nq; kq++) {
    var am = kq < nq ? Math.pow(1 - kq / nq, 1.6) : 0, ddx = Math.round(TX[kq % 9] * am * pk), ddy = Math.round(TY[kq % 9] * am * pk);
    tl.set(pe("o1"), { attr: { dx: Math.round(ddx - (ddx - ax) * .2), dy: Math.round(ddy - (ddy - ay) * .2) } }, en + kq * FQ);
    tl.set(pe("o2"), { attr: { dx: Math.round(ddx + (ddx - ax) * .2), dy: Math.round(ddy + (ddy - ay) * .2) } }, en + kq * FQ);
    ax = ddx; ay = ddy;
  }
  tl.to(pe("tr"), { opacity: 0, duration: FQ / 8, ease: "none", immediateRender: false }, en + (nq + 1) * FQ);
  tl.to({}, { duration: D }, 0);
  window.__timelines["shattered-glass"] = tl;
})();
</script>
