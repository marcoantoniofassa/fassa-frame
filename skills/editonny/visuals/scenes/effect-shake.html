<script>
(function () {
  const C = (window.__scenes || {})["effect-shake"] || { duration: 2.0 };
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  var D = C.duration || 2.0, t0 = 0;

  var P = {
    strength: 0.7, // 0–1: shake magnitude; one peaks around 26 pixels.
    jolts: 0, // Number of shakes; zero derives it from duration, approximately one per 0.95 seconds.
    axis: "both", // Shake axis: "both", "horizontal", or "vertical".
  };


  var strength = Number(P.strength); if (strength !== strength) strength = .7; strength = Math.max(0, Math.min(1, strength));
  var axis = String(P.axis || "both").toLowerCase();
  var ex = axis.indexOf("vert") === 0 ? 0 : 1, ey = axis.indexOf("horiz") === 0 ? 0 : 1;
  var peak = 26 * strength;

  var TX = [1.00, -0.88, 0.64, -0.92, 0.48, 0.80, -0.70, 0.55, -0.96, 0.60, -0.45, -0.85, 0.74, -0.52, 0.90, 0.46, -0.78, 0.66, -0.50, 0.84, -0.62, 0.48, 0.72, -0.56];
  var TY = [-0.72, 0.95, -0.82, 0.50, 0.76, -0.90, 0.58, -0.47, 0.88, -0.66, -0.52, 0.80, -0.94, 0.62, -0.74, 0.70, 0.54, -0.86, 0.60, -0.46, -0.74, 0.92, -0.58, 0.50];
  var START = [0, 8, 14, 3, 11, 19];

  var COPIES = [-.18, -.06, .06, .18];

  var FQ = 1 / 30, q0 = Math.ceil((t0 + .05 + FQ / 4) * 30 - .001), enter = q0 * FQ - FQ / 4, end = t0 + D - .1;

  var fitCount = Math.max(6, Math.floor((end - enter) / FQ));
  var nt = Math.round(Number(P.jolts)); if (!(nt >= 1)) nt = Math.max(1, Math.round((end - enter) / .95));
  nt = Math.max(1, Math.min(nt, Math.floor(fitCount / 6)));

  var VY = ex ? TY : TX;

  tl.fromTo("#effectshake-v", { opacity: 0 }, { opacity: 1, duration: FQ / 8, ease: "none" }, enter);
  for (j = 0; j < nt; j++) {
    for (k = 0; k <= spanDuration; k++) {
      tq = enter + (j * step + k) * FQ;

      damping = k < spanDuration ? Math.pow(1 - k / spanDuration, 1.8) * (j ? .75 : 1) : 0;
      i = (START[j % 6] + k) % 24;
