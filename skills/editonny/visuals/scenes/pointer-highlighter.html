<script>
(function () {
  const C = (window.__scenes || {})["pointer-highlighter"] || { duration: 2.4 };
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  var D = C.duration || 2.4, t0 = 0;

  var P = {
    x: 490, // Strip center on the 1080×1920 canvas, in pixels.
    y: 700, // Strip center, in pixels.
    width: 520, // Strip length, in pixels.

  var channels = (getComputedStyle(ink).color.match(/[\d.]+/g) || [255, 230, 0]), ci;
  for (ci = 0; ci < 3; ci++) document.getElementById("pointerhighlighter-" + "rgb".charAt(ci)).setAttribute("slope", (channels[ci] / 255).toFixed(3));

  var tip = Math.min(alt * .26, widthValue * .12), n1 = function (v) { return Math.round(v * 10) / 10; };
  var shape = function (end) {
    var e0 = tip * .3, go = function (f) { return e0 + (end - tip * .3 - e0) * f; }, pi, q, m, d;

      [go(.66), .96], [go(.3), 1],

    q = pts[pts.length - 1]; d = "M " + n1((q[0] + pts[0][0]) / 2) + " " + n1((q[1] + pts[0][1]) / 2 * alt);
    for (pi = 0; pi < pts.length; pi++) {

      d += " Q " + n1(q[0]) + " " + n1(q[1] * alt) + ", " + n1((q[0] + m[0]) / 2) + " " + n1((q[1] + m[1]) / 2 * alt);
    }

  tl.fromTo("#pointerhighlighter-a", { clipPath: shape(tip * .9) }, { clipPath: shape(widthValue), duration: .35, ease: "power1.inOut", immediateRender: false }, enter);
