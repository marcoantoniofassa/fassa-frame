<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><title>editonny · Pointer red cross</title></head>

<!-- Pointer red cross. To reject an option or mark something as incorrect. -->

<template id="pointer-red-cross-template">
<style>
@font-face{font-family:"Inter";src:url("assets/visuals/fonts/inter-var-latin.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"Inter";src:url("assets/visuals/fonts/inter-var-latin-ext.woff2") format("woff2");font-weight:100 900;font-display:block;unicode-range:U+0100-02BA,U+1E00-1E9F,U+20A0-20C0}
#root{position:absolute;inset:0;overflow:hidden;font-family:"Inter",sans-serif}
#pointerredcross-a{position:absolute;left:0;top:0;width:10px;height:10px;opacity:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5)) drop-shadow(0 7px 12px rgba(0,0,0,.4))}
#pointerredcross-s{position:absolute;left:0;top:0;overflow:visible}
.pointerredcross-k{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round}
.pointerredcross-b{fill:#fff;stroke:#fff;stroke-linejoin:round}
.pointerredcross-f{stroke:none}
</style>
<div id="root" data-composition-id="pointer-red-cross" data-width="1080" data-height="1920" data-duration="2.0">
<div id="pointerredcross-a"><svg id="pointerredcross-s" xmlns="http://www.w3.org/2000/svg" width="10" height="10"><defs><mask id="pointerredcross-m1" maskUnits="userSpaceOnUse"><path id="pointerredcross-k1" class="pointerredcross-k"/></mask><mask id="pointerredcross-m2" maskUnits="userSpaceOnUse"><path id="pointerredcross-k2" class="pointerredcross-k"/></mask><mask id="pointerredcross-n1" maskUnits="userSpaceOnUse"><path id="pointerredcross-j1" class="pointerredcross-k"/></mask><mask id="pointerredcross-n2" maskUnits="userSpaceOnUse"><path id="pointerredcross-j2" class="pointerredcross-k"/></mask></defs><path id="pointerredcross-b1" class="pointerredcross-b" mask="url(#pointerredcross-n1)"/><path id="pointerredcross-b2" class="pointerredcross-b" mask="url(#pointerredcross-n2)"/><path id="pointerredcross-f1" class="pointerredcross-f" mask="url(#pointerredcross-m1)"/><path id="pointerredcross-f2" class="pointerredcross-f" mask="url(#pointerredcross-m2)"/></svg></div>
</div>
<script>
(function () {
  const C = (window.__scenes || {})["pointer-red-cross"] || { duration: 2.0 };
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  var D = C.duration || 2.0, t0 = 0;

  var P = {
    x: 540, // Cross center on the 1080×1920 canvas, in pixels.
    y: 620, // Cross center, in pixels.
    size: 240, // Cross side length, in pixels.
    color: "#ff3b30", // Stroke color.
  };


  var side = P.size, esp = side * .18, border = Math.max(3.5, esp * .17);

  var up = side / 2 - border - esp * .45, bottom = side / 2 - border - esp * .31;
  var get = function (s) { return document.getElementById("pointerredcross-" + s); };
  var box = get("a"); box.style.left = P.x + "px"; box.style.top = P.y + "px";

  var curve = function (a, b, belly, n) {
    var list = [], i, u, cx = (a[0] + b[0]) / 2 - (b[1] - a[1]) * belly, cy = (a[1] + b[1]) / 2 + (b[0] - a[0]) * belly;
    for (i = 0; i <= n; i++) { u = i / n; list.push([(1 - u) * (1 - u) * a[0] + 2 * u * (1 - u) * cx + u * u * b[0], (1 - u) * (1 - u) * a[1] + 2 * u * (1 - u) * cy + u * u * b[1]]); }
    return list;
  };
  var direction = function (pts, i) { var a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], m = Math.sqrt(dx * dx + dy * dy) || 1; return [dx / m, dy / m]; };

  var brush = function (pts, profileValue) {
    var n = pts.length, outbound = [], returnMotion = [], i, k, g, w, ang;
    for (i = 0; i < n; i++) { g = direction(pts, i); w = esp * profileValue(i / (n - 1)) / 2; outbound.push([pts[i][0] - g[1] * w, pts[i][1] + g[0] * w]); returnMotion.unshift([pts[i][0] + g[1] * w, pts[i][1] - g[0] * w]); }
    g = direction(pts, n - 1); w = esp * profileValue(1) / 2;
    for (k = 1; k < 8; k++) { ang = Math.PI * k / 8; outbound.push([pts[n - 1][0] + w * (-Math.cos(ang) * g[1] + Math.sin(ang) * g[0]), pts[n - 1][1] + w * (Math.cos(ang) * g[0] + Math.sin(ang) * g[1])]); }
    outbound = outbound.concat(returnMotion); g = direction(pts, 0); w = esp * profileValue(0) / 2;
    for (k = 1; k < 8; k++) { ang = Math.PI * k / 8; outbound.push([pts[0][0] + w * (Math.cos(ang) * g[1] - Math.sin(ang) * g[0]), pts[0][1] + w * (-Math.cos(ang) * g[0] - Math.sin(ang) * g[1])]); }
    return "M" + outbound.map(function (q) { return q[0].toFixed(1) + " " + q[1].toFixed(1); }).join("L") + "Z";
  };

  var track = function (pts, remainingValue) {
    var n = pts.length, g0 = direction(pts, 0), g1 = direction(pts, n - 1), allItems = [[pts[0][0] - g0[0] * remainingValue, pts[0][1] - g0[1] * remainingValue]].concat(pts, [[pts[n - 1][0] + g1[0] * remainingValue, pts[n - 1][1] + g1[1] * remainingValue]]), comp = 0, i;
    for (i = 1; i < allItems.length; i++) comp += Math.sqrt(Math.pow(allItems[i][0] - allItems[i - 1][0], 2) + Math.pow(allItems[i][1] - allItems[i - 1][1], 2));
    return { d: "M" + allItems.map(function (q) { return q[0].toFixed(1) + " " + q[1].toFixed(1); }).join("L"), comp: comp + 2 };
  };

  var comps = [], assemble = function (num, pts, profileValue, padding) {
    var tr = track(pts, esp * .75 + border + 4), q, maskValue; comps[num] = tr.comp + border + 10;
    for (q = 0; q < 2; q++) {
      maskValue = get((q ? "j" : "k") + num); maskValue.setAttribute("d", tr.d); maskValue.setAttribute("stroke-width", esp * 1.26 + border * 2 + 4);
      maskValue.setAttribute("stroke-dasharray", (tr.comp + q * border) + " " + (tr.comp + 200 + border)); maskValue.setAttribute("stroke-dashoffset", comps[num]);
      maskValue = get((q ? "n" : "m") + num); maskValue.setAttribute("x", -padding); maskValue.setAttribute("y", -padding); maskValue.setAttribute("width", padding * 2); maskValue.setAttribute("height", padding * 2);
    }
    get("b" + num).setAttribute("d", brush(pts, profileValue)); get("b" + num).setAttribute("stroke-width", border * 2);
    get("f" + num).setAttribute("d", brush(pts, profileValue)); get("f" + num).setAttribute("fill", P.color);
  };

  var profileFrom = function (phaseValue) { return function (u) { return (.9 + .24 * Math.sin(Math.PI * Math.min(1, u / .35) / 2)) * (1 - .46 * Math.pow(Math.max(0, (u - .4) / .6), 1.5)) * (1 + .03 * Math.sin(u * 9 + phaseValue)); }; };
  assemble(1, curve([-up, -up * .98], [bottom * .98, bottom], .045, 26), profileFrom(0), side);
  assemble(2, curve([up, -up], [-bottom * .97, bottom * .97], -.04, 26), profileFrom(2.1), side);

  var enter = t0 + .05, landItem = enter + .34, exit = t0 + D - .3, shake = [11, -9, 7, -5, 3, 0], step = .042, shakeEnd = landItem + shake.length * step, j, q;
  tl.fromTo("#pointerredcross-a", { opacity: 0 }, { opacity: 1, duration: .04, ease: "none" }, enter);
  tl.fromTo("#pointerredcross-k1, #pointerredcross-j1", { strokeDashoffset: comps[1] }, { strokeDashoffset: 0, duration: .15, ease: "power1.out" }, enter);
  tl.fromTo("#pointerredcross-k2, #pointerredcross-j2", { strokeDashoffset: comps[2] }, { strokeDashoffset: 0, duration: .15, ease: "power1.out" }, enter + .19);
  for (j = 0; j < shake.length; j++) tl.to("#pointerredcross-a", { x: shake[j], duration: step, ease: "sine.inOut", immediateRender: false }, landItem + j * step);

  var count = Math.max(0, Math.floor((exit - shakeEnd) / .85)), lightValue = [6, -4, 2, 0];
  for (j = 0; j < count; j++) for (q = 0; q < lightValue.length; q++) tl.to("#pointerredcross-a", { x: lightValue[q], duration: step, ease: "sine.inOut", immediateRender: false }, shakeEnd + .55 + j * .85 + q * step);
  tl.to("#pointerredcross-a", { opacity: 0, duration: .25, ease: "power2.in", immediateRender: false }, exit);
  tl.to({}, { duration: D }, 0);
  window.__timelines["pointer-red-cross"] = tl;
})();
</script>
</template>
</body></html>
