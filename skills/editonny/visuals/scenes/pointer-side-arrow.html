<script>
(function () {
  const C = (window.__scenes || {})["pointer-side-arrow"] || { duration: 2.4 };
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  var D = C.duration || 2.4, t0 = 0;

  var P = {
    x: 540, // Arrow tip on the 1080×1920 canvas, in pixels.
    y: 620, // Arrow tip, in pixels.

  tl.fromTo(box, { opacity: 1 }, { opacity: 0, duration: .24, ease: "power2.in", immediateRender: false }, exit);
