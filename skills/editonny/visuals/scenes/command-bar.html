<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><title>editonny · Command bar</title></head>
<body>
<!-- Command bar. When showing a computer or AI command: the command types in, Enter submits it, and stages receive checks one by one. -->

<template id="command-bar-template">
<style>
@font-face{font-family:"Inter";src:url("assets/visuals/fonts/inter-var-latin.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"Inter";src:url("assets/visuals/fonts/inter-var-latin-ext.woff2") format("woff2");font-weight:100 900;font-display:block;unicode-range:U+0100-02BA,U+1E00-1E9F,U+20A0-20C0}
#root{position:absolute;inset:0;overflow:hidden;font-family:"Inter",sans-serif}
#commandbar-w{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0;overflow:hidden}
#commandbar-bg{position:absolute;inset:0;opacity:0;background:#0d0f16}
#commandbar-wp{position:absolute;left:-120px;top:-120px;width:1320px;height:2160px;filter:blur(16px)}
#commandbar-wp i{position:absolute;display:block;border-radius:50%;filter:blur(60px);opacity:.75}
.commandbar-o1{left:-80px;top:120px;width:900px;height:900px;background:#2c3d8f}
.commandbar-o2{left:560px;top:820px;width:860px;height:860px;background:#6a2a7a}
.commandbar-o3{left:140px;top:1400px;width:760px;height:700px;background:#0f5d6b}
.commandbar-jn{position:absolute;border-radius:28px;overflow:hidden;background:rgba(28,30,38,.92);border:3px solid rgba(255,255,255,.14);box-shadow:0 40px 80px rgba(0,0,0,.5)}
.commandbar-jn b{position:absolute;display:block}
.commandbar-jb{left:0;right:0;top:0;height:70px;background:rgba(255,255,255,.08)}
.commandbar-th{width:210px;height:210px;border-radius:18px;background:linear-gradient(150deg,#56607a,#2a2f3d)}
.commandbar-vd{left:200px;top:100px;width:420px;height:330px;border-radius:14px;background:linear-gradient(160deg,#6b5a4a,#2b2420)}
.commandbar-tr{height:40px;border-radius:10px;opacity:.85}
#commandbar-dim{position:absolute;inset:0;background:rgba(0,0,0,.32)}
#commandbar-cam{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0}
#commandbar-pn{position:absolute;left:150px;top:900px;transform:translateY(-50%);width:780px;border-radius:46px;background:rgba(32,34,42,.72);backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);box-shadow:0 40px 100px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.12) inset;color:#f4f5f8;overflow:hidden}
#commandbar-lin{position:relative;display:flex;align-items:center;gap:26px;padding:34px 30px 34px 40px}
.commandbar-lp{flex:0 0 auto;width:60px;height:60px;fill:none;stroke:currentColor;stroke-width:4.5;stroke-linecap:round;opacity:.7}
#commandbar-tt{flex:1 1 auto;font-weight:600;line-height:1.16;letter-spacing:-.015em}
#commandbar-ent{position:relative;flex:0 0 auto;width:84px;height:72px;border-radius:18px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.18)}
#commandbar-ent svg{position:absolute;left:21px;top:15px;width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
#commandbar-sep{height:2px;margin:0 30px;background:rgba(255,255,255,.12)}
#commandbar-its{padding:16px 30px 10px 30px}
.commandbar-it{position:relative;display:flex;align-items:center;gap:30px;padding:18px 16px;border-radius:26px;opacity:0}
.commandbar-ic{position:relative;flex:0 0 auto;width:78px;height:78px}
.commandbar-sp{position:absolute;left:0;top:0;width:78px;height:78px}
.commandbar-sp svg{width:78px;height:78px;fill:none;stroke-width:7;stroke-linecap:round}
.commandbar-fi{position:absolute;left:0;top:0;width:78px;height:78px;border-radius:50%;background:#32d74b;opacity:0}
.commandbar-ck{position:absolute;left:0;top:0;width:78px;height:78px;fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.commandbar-tx{flex:1 1 auto;font-weight:600;line-height:1.15;letter-spacing:-.01em}
#commandbar-ft{margin:6px 30px 0;padding:22px 16px 30px;border-top:2px solid rgba(255,255,255,.12);font-size:44px;font-weight:600;color:#32d74b;opacity:0}
.commandbar-ch{position:relative;opacity:0}
.commandbar-z{position:relative}
.commandbar-k{position:absolute;right:-.07em;top:.08em;width:.07em;height:1em;border-radius:3px;background:#32d74b;opacity:0}
#commandbar-dof{position:absolute;inset:0;opacity:0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);-webkit-mask-image:radial-gradient(ellipse 72% 52% at 50% 48%,transparent 58%,#000 100%);mask-image:radial-gradient(ellipse 72% 52% at 50% 48%,transparent 58%,#000 100%)}
#commandbar-vin{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse 82% 66% at 50% 48%,rgba(0,0,0,0) 50%,rgba(0,0,0,.55) 100%)}
</style>
<div id="root" data-composition-id="command-bar" data-width="1080" data-height="1920" data-duration="4.8">
<div id="commandbar-w"><div id="commandbar-bg"><div id="commandbar-wp"><i class="commandbar-o1"></i><i class="commandbar-o2"></i><i class="commandbar-o3"></i><div class="commandbar-jn" style="left:40px;top:260px;width:760px;height:620px"><b class="commandbar-jb"></b><b class="commandbar-th" style="left:40px;top:110px"></b><b class="commandbar-th" style="left:270px;top:110px"></b><b class="commandbar-th" style="left:500px;top:110px"></b><b class="commandbar-th" style="left:40px;top:350px"></b><b class="commandbar-th" style="left:270px;top:350px"></b><b class="commandbar-th" style="left:500px;top:350px"></b></div><div class="commandbar-jn" style="left:420px;top:1080px;width:820px;height:700px"><b class="commandbar-jb"></b><b class="commandbar-vd"></b><b class="commandbar-tr" style="top:470px;left:40px;width:420px;background:#4f7cff"></b><b class="commandbar-tr" style="top:470px;left:480px;width:260px;background:#4f7cff"></b><b class="commandbar-tr" style="top:530px;left:120px;width:300px;background:#ff9f0a"></b><b class="commandbar-tr" style="top:590px;left:40px;width:640px;background:#32d74b"></b></div></div><div id="commandbar-dim"></div></div><div id="commandbar-cam"><div id="commandbar-pn"><div id="commandbar-lin"><svg class="commandbar-lp" viewBox="0 0 48 48"><circle cx="20" cy="20" r="13"/><path d="M30 30 L42 42"/></svg><div id="commandbar-tt"></div><div id="commandbar-ent"><svg viewBox="0 0 40 40"><path d="M30 8 L30 22 L10 22 M16 15 L9 22 L16 29"/></svg></div></div><div id="commandbar-ls"><div id="commandbar-sep"></div><div id="commandbar-its"></div><div id="commandbar-ft"></div></div></div></div><div id="commandbar-dof"></div><div id="commandbar-vin"></div></div>
</div>
<script>
(function () {
  const C = (window.__scenes || {})["command-bar"] || { duration: 4.8 };
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  var D = C.duration || 4.8, t0 = 0;

  var P = {
    command: "edit video with captions and zoom", // Command typed into the bar.
    steps: "Trimmed pauses|Added captions|Applied zoom", // Two to five checked stages separated by |.
    background: "dark", // "dark" or "light" selects the bar and background color.
  };


  var darkness = String(P.background || "dark") !== "light";
  var $ = function (id) { return document.getElementById(id); };
  var steps = String(P.steps || "").split("|").map(function (s) { return s.trim(); }).filter(function (s) { return s; }).slice(0, 5);
  if (!steps.length) steps = ["Done"];
  var green = darkness ? "#32d74b" : "#1fa33a", pn = $("commandbar-pn");
  if (!darkness) {
    $("commandbar-bg").style.background = "#e9ecf3"; $("commandbar-dim").style.background = "rgba(255,255,255,.18)";
    document.querySelector("#commandbar-wp .commandbar-o1").style.background = "#9fb6ff"; document.querySelector("#commandbar-wp .commandbar-o2").style.background = "#f3b6d8"; document.querySelector("#commandbar-wp .commandbar-o3").style.background = "#9fe3d6";
    document.querySelectorAll("#commandbar-wp .commandbar-jn").forEach(function (e) { e.style.background = "rgba(255,255,255,.92)"; e.style.borderColor = "rgba(0,0,0,.06)"; e.style.boxShadow = "0 40px 80px rgba(40,50,80,.2)"; });
    document.querySelectorAll("#commandbar-wp .commandbar-jb").forEach(function (e) { e.style.background = "rgba(0,0,0,.05)"; });
    document.querySelectorAll("#commandbar-wp .commandbar-th").forEach(function (e) { e.style.background = "linear-gradient(150deg,#d5dbea,#aab3c9)"; });
    pn.style.background = "rgba(250,251,253,.78)"; pn.style.color = "#15161b"; pn.style.boxShadow = "0 40px 100px rgba(40,50,80,.28),0 0 0 2px rgba(0,0,0,.06) inset";
    $("commandbar-ent").style.background = "rgba(0,0,0,.06)"; $("commandbar-ent").style.borderColor = "rgba(0,0,0,.1)";
    $("commandbar-sep").style.background = "rgba(0,0,0,.08)"; $("commandbar-ft").style.borderTopColor = "rgba(0,0,0,.08)";
    $("commandbar-vin").style.background = "radial-gradient(ellipse 82% 66% at 50% 48%,rgba(0,0,0,0) 55%,rgba(20,30,60,.3) 100%)";
  }
  $("commandbar-ft").style.color = green;
  function assemble(el, txt) {
    var cs = Array.from(String(txt).normalize("NFC")), z = document.createElement("span"), k = document.createElement("i"), i, s;
    el.innerHTML = ""; z.className = "commandbar-z"; k.className = "commandbar-k"; k.id = el.id + "k"; z.appendChild(k); el.appendChild(z);
    for (i = 0; i < cs.length; i++) {
      s = document.createElement("span"); s.className = "commandbar-ch"; s.id = el.id + "_" + i; s.textContent = cs[i];
      k = document.createElement("i"); k.className = "commandbar-k"; k.id = el.id + "k" + i; s.appendChild(k); el.appendChild(s);
    }
    el.querySelectorAll("i.commandbar-k").forEach(function (c) { c.style.background = green; });
    return cs.length;
  }

  function measure(txts, widthValue, maxPx, minPx, lines, lh, style) {
    var m = document.createElement("div"), px = maxPx, ok, j;
    m.style.cssText = "position:absolute;left:-99999px;top:0;visibility:hidden;font-family:Inter,sans-serif;white-space:normal;" + style + ";width:" + Math.round(widthValue * .93) + "px;line-height:" + lh;
    document.body.appendChild(m);
    for (; px > minPx; px -= 2) {
      m.style.fontSize = px + "px"; ok = true;
      for (j = 0; j < txts.length; j++) { m.textContent = txts[j]; if (m.offsetHeight > px * lh * lines + 4 || m.scrollWidth > widthValue * .93 + 2) { ok = false; break; } }
      if (ok) break;
    }
    document.body.removeChild(m); return px;
  }
  function whenFont(f) { if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { f(); tl.invalidate(); }); }
  var tt = $("commandbar-tt"), nC = assemble(tt, P.command || "edit video");
  var its = $("commandbar-its"), txs = [];
  steps.forEach(function (s, q) {
    var it = document.createElement("div"); it.className = "commandbar-it"; it.id = "commandbar-it" + q;
    it.innerHTML = '<div class="commandbar-ic"><div class="commandbar-sp" id="commandbar-sp' + q + '"><svg viewBox="0 0 78 78"><circle cx="39" cy="39" r="30" stroke="' + (darkness ? "rgba(255,255,255,.18)" : "rgba(0,0,0,.1)") + '"/><circle cx="39" cy="39" r="30" stroke="' + green + '" stroke-dasharray="52 200"/></svg></div><div class="commandbar-fi" id="commandbar-fi' + q + '" style="background:' + green + '"></div><svg class="commandbar-ck" viewBox="0 0 78 78"><path id="commandbar-cp' + q + '" d="M23 40 L34 51 L56 28" stroke-dasharray="50" stroke-dashoffset="50"/></svg></div><div class="commandbar-tx" id="commandbar-tx' + q + '"></div>';
    its.appendChild(it); $("commandbar-tx" + q).textContent = s; txs.push($("commandbar-tx" + q));
  });
  function adjust() {
    tt.style.fontSize = measure([String(P.command || "edit video")], 540, 66, 46, 2, 1.16, "font-weight:600;letter-spacing:-.015em") + "px";
    var px = measure(steps, 560, 58, 46, 2, 1.15, "font-weight:600;letter-spacing:-.01em");
    txs.forEach(function (e) { e.style.fontSize = px + "px"; });
  }
  adjust(); whenFont(adjust);
  $("commandbar-ft").textContent = "Done · " + steps.length + (steps.length > 1 ? " stages completed" : " stage completed");

  function closeAt() { return Math.max(0, pn.offsetHeight - $("commandbar-lin").offsetHeight); }
  function yF() { return Math.round(closeAt() / 2); }
  function cut() { return "inset(0px 0px " + closeAt() + "px 0px round 46px)"; }


  var enter = t0 + .05, exit = t0 + D - .32, u = exit - enter;
  var ta = enter + .32, tb = ta + Math.max(.45, Math.min(1.2, .24 * u, nC * .06)), tE = tb + .14;
  var tI0 = tE + .3, tIE = exit - Math.max(.32, .1 * u), slot = (tIE - tI0) / steps.length;
  tl.fromTo("#commandbar-w", { opacity: 0 }, { opacity: 1, duration: .01, ease: "none" }, enter);
  tl.fromTo("#commandbar-bg", { opacity: 0 }, { opacity: 1, duration: .22, ease: "power1.out" }, enter);
  tl.fromTo("#commandbar-wp", { x: 0, y: 40 }, { x: -40, y: -40, duration: exit - enter + .3, ease: "none" }, enter);
  tl.fromTo("#commandbar-cam", { opacity: 0 }, { opacity: 1, duration: .14, ease: "power1.out" }, enter);
  tl.fromTo("#commandbar-cam", { y: function () { return yF() + 260; }, rotationX: 22, rotationY: 8, transformPerspective: 1800, filter: "blur(24px)" },
    { y: yF, rotationX: 7, rotationY: 3, transformPerspective: 1800, filter: "blur(0px)", duration: .5, ease: "power3.out", immediateRender: false }, enter);
  tl.fromTo("#commandbar-dof", { opacity: 0 }, { opacity: 1, duration: .3, ease: "none" }, enter + .1);
  tl.fromTo("#commandbar-vin", { opacity: 0 }, { opacity: 1, duration: .3, ease: "none" }, enter);
  var vM = Math.max(1, Math.round((exit - enter - .5) / 1.3)), dM = (exit - enter - .5) / vM;
  tl.fromTo("#commandbar-cam", { rotation: -.4 }, { rotation: .4, duration: dM, ease: "sine.inOut", yoyo: true, repeat: vM - 1, immediateRender: false }, enter + .5);
  tl.fromTo("#commandbar-cam", { rotationY: 3 }, { rotationY: .5, duration: dM, ease: "sine.inOut", yoyo: true, repeat: vM - 1, immediateRender: false }, enter + .5);

  tl.fromTo("#commandbar-pn", { clipPath: cut }, { clipPath: cut, duration: .01, ease: "none", immediateRender: false }, enter);
  tl.fromTo("#commandbar-ls", { opacity: 0 }, { opacity: 0, duration: .01, ease: "none" }, enter);

  tl.fromTo("#commandbar-ttk", { opacity: 0 }, { opacity: 1, duration: .01, ease: "steps(1)" }, enter + .12);
  tl.to("#commandbar-ttk", { opacity: 0, duration: .01, ease: "steps(1)", immediateRender: false }, ta);
  var dL = (tb - ta) / Math.max(1, nC), q, tq;
  for (q = 0; q < nC; q++) {
    tq = ta + q * dL;
    tl.fromTo("#commandbar-tt_" + q, { opacity: 0 }, { opacity: 1, duration: .01, ease: "steps(1)" }, tq);
    tl.fromTo("#commandbar-ttk" + q, { opacity: 0 }, { opacity: 1, duration: .01, ease: "steps(1)" }, tq);
    if (q < nC - 1) tl.to("#commandbar-ttk" + q, { opacity: 0, duration: .01, ease: "steps(1)", immediateRender: false }, tq + dL);
  }
  tl.to("#commandbar-ttk" + (nC - 1), { opacity: 0, duration: .01, ease: "steps(1)", immediateRender: false }, tE + .1);

  tl.fromTo("#commandbar-ent", { y: 0 }, { y: 6, duration: .07, ease: "power1.out", yoyo: true, repeat: 1 }, tE - .03);
  tl.fromTo("#commandbar-ent", { backgroundColor: darkness ? "rgba(255,255,255,.12)" : "rgba(0,0,0,.06)" }, { backgroundColor: green, duration: .08, ease: "none", yoyo: true, repeat: 1, immediateRender: false }, tE - .03);
  tl.to("#commandbar-pn", { clipPath: "inset(0px 0px 0px 0px round 46px)", duration: .45, ease: "power3.inOut", immediateRender: false }, tE + .05);
  tl.to("#commandbar-ls", { opacity: 1, duration: .2, ease: "none", immediateRender: false }, tE + .05);
  tl.to("#commandbar-cam", { y: 0, duration: .5, ease: "power3.inOut", immediateRender: false }, tE + .05);

  steps.forEach(function (s, q) {
    var tA = tI0 + q * slot, tC = tA + Math.max(.2, Math.min(.6, slot * .55));
    tl.fromTo("#commandbar-it" + q, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: .25, ease: "power3.out" }, tA);
    tl.fromTo("#commandbar-sp" + q, { rotation: 0 }, { rotation: 360 * Math.max(1, Math.round((tC - tA) / .45)), duration: tC - tA, ease: "none" }, tA);
    tl.to("#commandbar-sp" + q, { opacity: 0, duration: .08, ease: "none", immediateRender: false }, tC);
    tl.fromTo("#commandbar-fi" + q, { opacity: 0 }, { opacity: 1, duration: .1, ease: "none" }, tC);
    tl.fromTo("#commandbar-cp" + q, { strokeDashoffset: 50 }, { strokeDashoffset: 0, duration: .22, ease: "power2.out" }, tC + .03);
  });
  tl.fromTo("#commandbar-ft", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .25, ease: "power2.out" }, Math.min(exit - .15, tIE + .05));
  tl.to("#commandbar-cam", { y: -280, rotationX: -6, filter: "blur(28px)", duration: .3, ease: "power2.in", immediateRender: false }, exit);
  tl.to("#commandbar-w", { opacity: 0, duration: .3, ease: "power2.in", immediateRender: false }, exit);
  tl.to({}, { duration: D }, 0);
  window.__timelines["command-bar"] = tl;
})();
</script>
</template>
</body></html>
