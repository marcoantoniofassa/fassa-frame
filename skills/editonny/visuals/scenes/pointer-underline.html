<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><title>editonny · Pointer underline</title></head>
<body>
<!-- Pointer underline. To underline an important word, number, or phrase. -->

<template id="pointer-underline-template">
<style>
@font-face{font-family:"Inter";src:url("assets/visuals/fonts/inter-var-latin.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"Inter";src:url("assets/visuals/fonts/inter-var-latin-ext.woff2") format("woff2");font-weight:100 900;font-display:block;unicode-range:U+0100-02BA,U+1E00-1E9F,U+20A0-20C0}
#root{position:absolute;inset:0;overflow:hidden;font-family:"Inter",sans-serif}
#pointerunderline-a{position:absolute;left:0;top:0;width:10px;height:10px;opacity:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5)) drop-shadow(0 7px 12px rgba(0,0,0,.4))}
#pointerunderline-s{position:absolute;left:0;top:0;overflow:visible}
.pointerunderline-k{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round}
.pointerunderline-b{fill:#fff;stroke:#fff;stroke-linejoin:round}
.pointerunderline-f{stroke:none}
</style>
<div id="root" data-composition-id="pointer-underline" data-width="1080" data-height="1920" data-duration="2.2">
<div id="pointerunderline-a"><svg id="pointerunderline-s" xmlns="http://www.w3.org/2000/svg" width="10" height="10"><defs><mask id="pointerunderline-m1" maskUnits="userSpaceOnUse"><path id="pointerunderline-k1" class="pointerunderline-k"/></mask><mask id="pointerunderline-m2" maskUnits="userSpaceOnUse"><path id="pointerunderline-k2" class="pointerunderline-k"/></mask><mask id="pointerunderline-n1" maskUnits="userSpaceOnUse"><path id="pointerunderline-j1" class="pointerunderline-k"/></mask><mask id="pointerunderline-n2" maskUnits="userSpaceOnUse"><path id="pointerunderline-j2" class="pointerunderline-k"/></mask></defs><path id="pointerunderline-b1" class="pointerunderline-b" mask="url(#pointerunderline-n1)"/><path id="pointerunderline-b2" class="pointerunderline-b" mask="url(#pointerunderline-n2)"/><path id="pointerunderline-f1" class="pointerunderline-f" mask="url(#pointerunderline-m1)"/><path id="pointerunderline-f2" class="pointerunderline-f" mask="url(#pointerunderline-m2)"/></svg></div>
</div>
<script>
(function () {
  const C = (window.__scenes || {})["pointer-underline"] || { duration: 2.2 };
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  var D = C.duration || 2.2, t0 = 0;

  var P = {
    x: 540, // Underline center on the 1080×1920 canvas, in pixels.
    y: 620, // Height of the first underline stroke, in pixels; the second sits about three stroke widths lower.
    width: 460, // Underline width, in pixels.
    color: "#ff3b30", // Stroke color.
    thickness: 14, // Stroke thickness, in pixels.
  };


  var esp = P.thickness, border = Math.max(3.5, esp * .17), body = esp + border * 2, widthValue = P.width, xa = -widthValue / 2 + esp * .36, xb = widthValue / 2 - esp * .6, rise = widthValue * .012, wave = Math.min(esp * .4, widthValue * .014);
  var span = Math.max(body * 1.5, Math.min(body * 2.1, widthValue * .17)), shortValue = widthValue * .62;
  var get = function (s) { return document.getElementById("pointerunderline-" + s); };
  var box = get("a"); box.style.left = P.x + "px"; box.style.top = P.y + "px";
  var direction = function (pts, i) { var a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], m = Math.sqrt(dx * dx + dy * dy) || 1; return [dx / m, dy / m]; };

  var brush = function (pts, profileValue) {
    var n = pts.length, outbound = [], returnMotion = [], i, k, g, w, ang;
    for (i = 0; i < n; i++) { g = direction(pts, i); w = esp * profileValue(i / (n - 1)) / 2; outbound.push([pts[i][0] - g[1] * w, pts[i][1] + g[0] * w]); returnMotion.unshift([pts[i][0] + g[1] * w, pts[i][1] - g[0] * w]); }
    g = direction(pts, n - 1); w = esp * profileValue(1) / 2;
    for (k = 1; k < 8; k++) { ang = Math.PI * k / 8; outbound.push([pts[n - 1][0] + w * (-Math.cos(ang) * g[1] + Math.sin(ang) * g[0]), pts[n - 1][1] + w * (Math.cos(ang) * g[0] + Math.sin(ang) * g[1])]); }
    outbound = outbound.concat(returnMotion); g = direction(pts, 0); w = esp * profileValue(0) / 2;
    for (k = 1; k < 8; k++) { ang = Math.PI * k / 8; outbound.push([pts[0][0] + w * (Math.cos(ang) * g[1] - Math.sin(ang) * g[0]), pts[0][1] + w * (-Math.cos(ang) * g[0] - Math.sin(ang) * g[1])]); }
    return "M" + outbound.map(function (q) { return q[0].toFixed(1) + " " + q[1].toFixed(1); }).join("L") + "Z";
  };

  var track = function (pts, remainingValue) {
    var n = pts.length, g0 = direction(pts, 0), g1 = direction(pts, n - 1), allItems = [[pts[0][0] - g0[0] * remainingValue, pts[0][1] - g0[1] * remainingValue]].concat(pts, [[pts[n - 1][0] + g1[0] * remainingValue, pts[n - 1][1] + g1[1] * remainingValue]]), comp = 0, i;
    for (i = 1; i < allItems.length; i++) comp += Math.sqrt(Math.pow(allItems[i][0] - allItems[i - 1][0], 2) + Math.pow(allItems[i][1] - allItems[i - 1][1], 2));
    return { d: "M" + allItems.map(function (q) { return q[0].toFixed(1) + " " + q[1].toFixed(1); }).join("L"), comp: comp + 2 };
  };

  var comps = [], assemble = function (num, pts, profileValue, padding) {
    var tr = track(pts, esp * .75 + border + 4), q, maskValue; comps[num] = tr.comp + border + 10;
    for (q = 0; q < 2; q++) {
      maskValue = get((q ? "j" : "k") + num); maskValue.setAttribute("d", tr.d); maskValue.setAttribute("stroke-width", esp * 1.26 + border * 2 + 4);
      maskValue.setAttribute("stroke-dasharray", (tr.comp + q * border) + " " + (tr.comp + 200 + border)); maskValue.setAttribute("stroke-dashoffset", comps[num]);
      maskValue = get((q ? "n" : "m") + num); maskValue.setAttribute("x", -padding); maskValue.setAttribute("y", -padding); maskValue.setAttribute("width", padding * 2); maskValue.setAttribute("height", padding * 2);
    }
    get("b" + num).setAttribute("d", brush(pts, profileValue)); get("b" + num).setAttribute("stroke-width", border * 2);
    get("f" + num).setAttribute("d", brush(pts, profileValue)); get("f" + num).setAttribute("fill", P.color);
  };

  var total = 44, total2 = 40;
  var passes = function (phaseValue) {
    var one = [], anotherItem = [], i, u;
    for (i = 0; i <= total; i++) { u = i / total; one.push([xa + (xb - xa) * u, rise * (.5 - u) + wave * (Math.sin(u * Math.PI * 1.7 + .5) - Math.sin(.5) * (1 - u) - Math.sin(Math.PI * 1.7 + .5) * u) + (phaseValue ? 1.5 * Math.sin(u * 9 + phaseValue) : 0)]); }
    for (i = 0; i <= total2; i++) { u = i / total2; anotherItem.push([xb - shortValue * u, -rise * .5 + span * (.72 * (1 - Math.pow(1 - u, 5)) + .28 * u) + wave * .6 * Math.sin(u * Math.PI * 1.6) * u + (phaseValue ? 1.5 * Math.sin(9 - u * 7 + phaseValue) : 0)]); }
    return [one, anotherItem];
  };

  var pen1 = function (v) { return (.72 + .28 * Math.min(1, v / .07)) * (1 + .2 * Math.sin(Math.PI * Math.min(1, v / .8) / 2)) * (1 + .03 * Math.sin(v * 12) * (1 - v)); };
  var pen2 = function (v) { return 1.2 * (1 - .45 * Math.pow(Math.max(0, (v - .4) / .6), 1.5)) * (1 + .03 * Math.sin(v * 9) * v); };
  var base = passes(0), padding = widthValue + span + 60, shapes, k, networks;
  assemble(1, base[0], pen1, padding); assemble(2, base[1], pen2, padding);
  shapes = [[get("f1").getAttribute("d"), get("f2").getAttribute("d")]];
  for (k = 1; k < 3; k++) { networks = passes(k * 2.1); shapes.push([brush(networks[0], pen1), brush(networks[1], pen2)]); }

  var enter = t0 + .05, landItem = enter + .42, exit = t0 + D - .3, impact = .13, count = Math.max(2, Math.floor((exit - landItem - .1) / impact)), j;
  tl.fromTo("#pointerunderline-a", { opacity: 0 }, { opacity: 1, duration: .04, ease: "none" }, enter);
  tl.fromTo("#pointerunderline-k1, #pointerunderline-j1", { strokeDashoffset: comps[1] }, { strokeDashoffset: 0, duration: .24, ease: "power1.inOut" }, enter);
  tl.fromTo("#pointerunderline-k2, #pointerunderline-j2", { strokeDashoffset: comps[2] }, { strokeDashoffset: 0, duration: .17, ease: "power1.out" }, enter + .25);
  for (j = 0; j < count; j++) {
    k = j === count - 1 ? 0 : (j + 1) % 3;
    tl.set("#pointerunderline-b1, #pointerunderline-f1", { attr: { d: shapes[k][0] }, immediateRender: false }, landItem + .1 + j * impact);
    tl.set("#pointerunderline-b2, #pointerunderline-f2", { attr: { d: shapes[k][1] }, immediateRender: false }, landItem + .1 + j * impact);
  }
  tl.to("#pointerunderline-a", { opacity: 0, duration: .25, ease: "power2.in", immediateRender: false }, exit);
  tl.to({}, { duration: D }, 0);
  window.__timelines["pointer-underline"] = tl;
})();
</script>
</template>
</body></html>
