<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><title>editonny · Transition glow</title></head>
<body>
<!-- Transition glow. For a standard scene change: a warm light leak peaks at the cut. -->

<template id="transition-glow-template">
<style>
#root{position:absolute;inset:0;overflow:hidden}
#transitionglow-bk{position:absolute;inset:0;backdrop-filter:brightness(1.9) saturate(1.3) blur(6px);-webkit-backdrop-filter:brightness(1.9) saturate(1.3) blur(6px);opacity:0}
#transitionglow-l1{position:absolute;left:-300px;top:-200px;width:1680px;height:2320px;background:radial-gradient(60% 70% at 22% 38%,rgba(255,120,30,.98),rgba(255,40,0,.6) 45%,rgba(255,40,0,0) 75%);mix-blend-mode:screen;opacity:0}
#transitionglow-l2{position:absolute;left:-300px;top:-200px;width:1680px;height:2320px;background:radial-gradient(55% 60% at 82% 66%,rgba(255,176,64,.98),rgba(255,84,0,.55) 48%,rgba(255,84,0,0) 76%);mix-blend-mode:screen;opacity:0}
#transitionglow-w{position:absolute;inset:0;background:radial-gradient(90% 80% at 50% 48%,rgba(255,246,226,.96),rgba(255,176,92,.7) 58%,rgba(255,120,40,.25) 100%);mix-blend-mode:screen;opacity:0}
</style>
<div id="root" data-composition-id="transition-glow" data-width="1080" data-height="1920" data-duration="0.4">
<div id="transitionglow-bk"></div><div id="transitionglow-l1"></div><div id="transitionglow-l2"></div><div id="transitionglow-w"></div>
</div>
<script>
(function () {
  const C = (window.__scenes || {})["transition-glow"] || { duration: 0.4 };
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  var D = 0.4, t0 = 0;

  function rise(sel, a, b, c, peak, e1, e2) {
    tl.fromTo(sel, { opacity: 0 }, { opacity: peak, duration: b - a, ease: e1 || "sine.inOut" }, t0 + a);
    tl.to(sel, { opacity: 0, duration: c - b, ease: e2 || "sine.inOut", immediateRender: false }, t0 + b);
  }

  rise("#transitionglow-bk", D * .2, D * .5, D * .8, 1);
  rise("#transitionglow-l1", D * .1, D * .47, D * .85, 1);
  tl.fromTo("#transitionglow-l1", { x: -220 }, { x: 220, duration: D, ease: "none" }, t0);
  rise("#transitionglow-l2", D * .15, D * .5, D * .9, .95);
  tl.fromTo("#transitionglow-l2", { x: 220 }, { x: -220, duration: D, ease: "none" }, t0);
  rise("#transitionglow-w", D * .32, D * .5, D * .68, .95);
  tl.to({}, { duration: D }, 0);
  window.__timelines["transition-glow"] = tl;
})();
</script>
</template>
</body></html>
