<script>
(function () {
  const C = (window.__scenes || {})["solar-system"] || { duration: 5.0 };
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  var D = C.duration || 5.0, t0 = 0;

  var P = {
    x: 540, // Sun center on the 1080×1920 canvas, in pixels.
    y: 520, // Sun center, in pixels; the title is 283 pixels above it.
    title: "The universe in 3D", // Top-pill text.
    color: "#ff6a1f", // Accent color for the title dot and glow around the Sun.
  };


  var pe = function (s) { return document.getElementById("solarsystem-" + s); };
  var anchor = pe("a"); anchor.style.left = P.x + "px"; anchor.style.top = P.y + "px";
  var color = P.color || "#ff6a1f";
  pe("back").style.clipPath = "inset(0px 0px 330px 0px)"; pe("front").style.clipPath = "inset(330px 0px 0px 0px)";
  pe("dot").style.background = color; pe("tx").textContent = String(P.title || "");
  pe("gl").style.background = "radial-gradient(circle at center," + color + "66," + color + "22 38%,rgba(0,0,0,0) 66%)";
  var widthValue = function (txt, css) {
    var m = document.createElement("span"); m.style.cssText = "position:absolute;left:-99999px;top:0;visibility:hidden;white-space:nowrap;font-family:Inter,sans-serif;" + css;
    m.textContent = txt; document.body.appendChild(m); var w = m.getBoundingClientRect().width; document.body.removeChild(m); return w;
  };
  var fit = function () { var tx = pe("tx"), w = widthValue(tx.textContent, "font-weight:800;font-size:46px;letter-spacing:-.01em"), free = 800 - 64 - 38; tx.style.fontSize = (w > free ? Math.max(24, 46 * free / w) : 46) + "px"; };
  fit(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fit(); tl.invalidate(); });

  var enter = t0 + .05, exit = t0 + D - .3, TILT = 62, spin = exit + .3 - enter;
  var ANG = [20, 150, 260, 330], SPEED_VALUE = [62, 44, 30, 21];
  var orrs = anchor.querySelectorAll(".solarsystem-orr"), pps = anchor.querySelectorAll(".solarsystem-pl");
  gsap.set(orrs, { rotationX: TILT }); gsap.set(pps, { rotationX: -TILT });
  tl.fromTo(anchor, { opacity: 0 }, { opacity: 1, duration: .05, ease: "none" }, enter);
  tl.fromTo(pe("v"), { opacity: 0, y: 50, rotation: -40, filter: "blur(14px)" }, { opacity: 1, y: 0, rotation: 0, filter: "blur(0px)", duration: .6, ease: "power3.out" }, enter);
  tl.fromTo(pe("gl"), { opacity: 0 }, { opacity: 1, duration: .5, ease: "power2.out" }, enter + .1);
  tl.fromTo(orrs, { opacity: 0, rotationX: 89 }, { opacity: 1, rotationX: TILT, duration: .85, ease: "power3.out" }, enter + .08);
  tl.fromTo(pps, { rotationX: -89 }, { rotationX: -TILT, duration: .85, ease: "power3.out" }, enter + .08);
  tl.fromTo(pe("tt"), { opacity: 0, y: -26 }, { opacity: 1, y: 0, duration: .4, ease: "back.out(1.8)" }, enter + .12);
  ANG.forEach(function (a, j) {
    var rotation = SPEED_VALUE[j] * spin;
    tl.fromTo(anchor.querySelectorAll(".solarsystem-a" + j), { rotation: a }, { rotation: a + rotation, duration: spin, ease: "none" }, enter);
    tl.fromTo(anchor.querySelectorAll(".solarsystem-l" + j), { rotation: -a }, { rotation: -(a + rotation), duration: spin, ease: "none" }, enter);
  });

  var live = enter + .7, padding = exit - live, turns = Math.max(1, Math.round(padding / 1.3)), halfValue = padding / (turns * 2);
  if (halfValue > .15) tl.to(pe("v"), { y: -8, duration: halfValue, ease: "sine.inOut", yoyo: true, repeat: turns * 2 - 1, immediateRender: false }, live);
  tl.to(anchor, { opacity: 0, y: -30, duration: .26, ease: "power2.in", immediateRender: false }, exit);
  tl.to({}, { duration: D }, 0);
  window.__timelines["solar-system"] = tl;
})();
</script>
