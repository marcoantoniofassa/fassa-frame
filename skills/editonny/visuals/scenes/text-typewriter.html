  var pont = {}, has = {};
  for (k = 0; k < W.length; k++) { s = String(W[k].text).replace(/\s+$/, ""); if (/[.!?…,;:]$/.test(s)) pont[Math.max(0.05, W[k].t).toFixed(3)] = 1; }
