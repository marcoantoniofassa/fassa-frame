<script>
(function () {
  const C = (window.__scenes || {})["effect-glow"] || { duration: 2.8 };

  const tl = gsap.timeline({ paused: true });

  var strength = Number(P.strength); if (!(strength >= 0)) strength = .65; strength = Math.min(1, strength);

  tl.to("#effectglow-v", { opacity: 0, duration: .28, ease: "sine.in", immediateRender: false }, exit);
  tl.to({}, { duration: D }, 0);
  window.__timelines["effect-glow"] = tl;
