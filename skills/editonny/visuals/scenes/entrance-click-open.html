  var PERSP = 1200, COMP = 1.3;

  var lg = Math.max(60, +P.width || 760), al = Math.max(60, +P.height || 428), cx = +P.x, cy = +P.y;

    var B = function (a, b, t) { var m = 1 - t; return 3 * m * m * t * a + 3 * m * t * t * b + t * t * t; };

  var maskY = KF([[0, .3667, 741, 75.813, [.23, .07, .41, .92]]]);

  var blur = KF([[.6667, .7333, 0, 8, [0, 0, 1, 1]], [.7333, .9333, 8, 0, [.33, 0, .67, 1]]]);
  var corners = KF([[.9333, 1.3, initialRadius, radius, [.2, 0, .8, 1]]]);
  var arrowX = KF([[.1333, .2, 1713.5, 1165.5, [.02, .03, .51, .7]], [.2, .5667, 1165.5, 544.5, [.02, .14, .4, 1]]]);
  var arrowE = KF([[.6, .6333, 68, 42, [.95, .04, .999, 1]], [.6333, .7, 42, 68, [.89, .08, .999, 1]]]);
  var arrowO = KF([[.7333, .9, 1, 0, [.42, 0, .58, 1]]]);
  var sparkle = KF([[.6, .6667, .5, 1.5, [1, 0, .85, .916]], [.6667, 1.3, 1.5, 0, [.1477, .5639, .8119, .9672]]]);

  var ent = t0 + .05, end = t0 + D, A = Math.min(COMP, .55 * D), k = A / COMP;
  var T = function (tau) { return ent + tau * k; }, TAU = function (t) { return (t - ent) / k; };
