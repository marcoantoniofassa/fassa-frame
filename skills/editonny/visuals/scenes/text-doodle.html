<!-- Text doodle. For a callout held for several seconds: letters appear individually and wobble like hand-drawn lettering through four stepped poses. -->

<template id="text-doodle-template">

    { text: "an", t: 1.00, end: 1.10 }, { text: "editor", t: 1.12, end: 1.56 }, { text: "to", t: 1.92, end: 2.06 },
    { text: "post", t: 2.08, end: 2.44 }, { text: "every", t: 2.46, end: 2.68 }, { text: "day.", t: 2.70, end: 3.05 }

    return o;
  })();

  function show(s) { return String(s).replace(/^\s+|\s+$/g, "").replace(/[.,;:…]+$/g, ""); }

  function screens(maxP, maxL) {
    var groups = [], cur = [], letters = 0, i, w, txt, out = [];
    for (i = 0; i < W.length; i++) {
      w = W[i]; txt = show(w.text); if (!txt || !(w.t < D - 0.2)) continue;

      cur.push({ text: txt, t: Math.max(0.05, w.t), end: Math.min(D - 0.05, Math.max(w.t + 0.08, w.end)) }); letters += txt.length + 1;

  function num(v, d) { if (v === "" || v === null || v === undefined) return d; v = Number(v); return isFinite(v) ? v : d; }

  var colorL = correctColor(P.color, "#ffffff"), typing = num(P.typing, 1) >= .5;
  var raw = String(P.text === undefined || P.text === null ? "TAP LEARN MORE" : P.text).toUpperCase().replace(/\r?\n/g, "|");
  var bar = raw.indexOf("|") >= 0, orig = [], letters = [], i, j, k;
  var elB = document.getElementById("textdoodle-b");

  raw.split("|").forEach(function (s) {
    s = s.replace(/^\s+|\s+$/g, ""); if (!s) return;
    orig.push(s.split(/\s+/).map(function (t) {
      var w = document.createElement("span"), g, cs = Array.from(t.normalize("NFC")), q;
      w.className = "textdoodle-w";
      for (q = 0; q < cs.length; q++) {
        g = document.createElement("span"); g.className = "textdoodle-g"; g.id = "textdoodle-g" + letters.length; g.textContent = cs[q];
        if (typing) g.style.opacity = "0";
        w.appendChild(g); letters.push(g);
      }
      return { s: t, el: w };
    }));
  });
  if (!orig.length) { var w0 = document.createElement("span"), g0 = document.createElement("span"); w0.className = "textdoodle-w"; g0.className = "textdoodle-g"; g0.id = "textdoodle-g0"; g0.textContent = "TITLE"; if (typing) g0.style.opacity = "0"; w0.appendChild(g0); letters.push(g0); orig.push([{ s: "TITLE", el: w0 }]); }


  var SPACING_VALUE = .26, SPAN = .12, LIM = 740, MAXL = 4, HMAX = 900;
  var med = document.createElement("div");
  med.setAttribute("aria-hidden", "true"); med.setAttribute("data-layout-ignore", "");
  med.style.cssText = "position:absolute;left:-6000px;top:0;visibility:hidden;white-space:nowrap;display:flex;font-family:Montserrat,sans-serif;font-weight:800;font-size:100px;line-height:1";
  document.body.appendChild(med);
  var memo = {};
  function widthValue(o) {
    var c = "_" + o.s, q, sp, cs;
    if (!(c in memo)) {
      while (med.firstChild) med.removeChild(med.firstChild);
      cs = Array.from(o.s.normalize("NFC"));
      for (q = 0; q < cs.length; q++) { sp = document.createElement("span"); sp.style.display = "inline-block"; sp.textContent = cs[q]; med.appendChild(sp); }
      memo[c] = med.getBoundingClientRect().width / 100;
    }
    return memo[c];
  }
  function lineWidthValue(ws) { var n = 0, q; for (q = 0; q < ws.length; q++) n += widthValue(ws[q]) + (q ? SPACING_VALUE : 0); return n; }

  function divide(ws, q) {
    var n = ws.length, m = [], c = [], a, b, d, v, out = [], end;
    for (a = 1; a <= q; a++) {
      m[a] = []; c[a] = [];
      for (b = a; b <= n; b++) {
        if (a === 1) { m[a][b] = lineWidthValue(ws.slice(0, b)); c[a][b] = 0; continue; }
        m[a][b] = 1e9;
        for (d = a - 1; d < b; d++) { v = Math.max(m[a - 1][d], lineWidthValue(ws.slice(d, b))); if (v < m[a][b]) { m[a][b] = v; c[a][b] = d; } }
      }
    }
    for (a = q, end = n; a >= 1; a--) { out.unshift(ws.slice(c[a][end], end)); end = c[a][end]; }
    return out;
  }

  function poses(g, n, amp) {
    var xs = [], ys = [], v, q;
    for (q = 0; q < 4; q++) {
      v = q * .25;
      xs.push("var(--textdoodle-k" + q + ") * " + (Math.cos(24.8 * v + 7.9 * n) * Math.sin(6.28 * v + n) * 3 * amp).toFixed(2) + "px");

    var parts = [], owner = [], largerValue = 0, im = 0, previousValue, which, n, H, top, ln, a, b, amp;
    var floor = bar ? Math.min(ceiling, 56) : Math.min(ceiling, Math.max(56, ceiling * .62));

    }
