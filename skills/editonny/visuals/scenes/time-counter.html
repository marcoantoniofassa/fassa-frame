<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><title>editonny · Time counter</title></head>
<body>
<!-- Time counter. When stating how long a task takes: a counter reaches the chosen time and unit. -->

<template id="time-counter-template">
<style>
@font-face{font-family:"Inter";src:url("assets/visuals/fonts/inter-var-latin.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"Inter";src:url("assets/visuals/fonts/inter-var-latin-ext.woff2") format("woff2");font-weight:100 900;font-display:block;unicode-range:U+0100-02BA,U+1E00-1E9F,U+20A0-20C0}
#root{position:absolute;inset:0;overflow:hidden;font-family:"Inter",sans-serif}
#timecounter-a{position:absolute;left:0;top:0;width:0;height:0;opacity:0}
#timecounter-c{position:absolute;left:0;top:0;width:720px;height:304px;border-radius:34px;background:rgba(24,25,32,.95);opacity:0;box-shadow:0 0 0 2px rgba(255,255,255,.16),0 4px 10px rgba(0,0,0,.25),0 24px 54px rgba(0,0,0,.5)}
#timecounter-s{position:absolute;left:0;top:0;overflow:visible}
#timecounter-n{position:absolute;left:58px;top:100px;width:180px;height:140px;display:flex;align-items:center;justify-content:center;font-family:"Inter";font-size:128px;font-weight:900;letter-spacing:-.05em;line-height:1;color:#fff;white-space:nowrap}
#timecounter-r{position:absolute;left:288px;top:96px;font-family:"Inter";font-size:42px;font-weight:700;letter-spacing:-.01em;line-height:1;color:#a1a1a6;white-space:nowrap}
#timecounter-u{position:absolute;left:285px;top:150px;font-family:"Inter";font-size:92px;font-weight:900;letter-spacing:-.025em;line-height:1;white-space:nowrap;opacity:0}
</style>
<div id="root" data-composition-id="time-counter" data-width="1080" data-height="1920" data-duration="3.6">
<div id="timecounter-a"><div id="timecounter-c"><svg id="timecounter-s" xmlns="http://www.w3.org/2000/svg" width="720" height="304"><rect x="132" y="20" width="32" height="22" rx="7" fill="#d1d1d6"/><rect x="141" y="38" width="14" height="22" fill="#d1d1d6"/><rect id="timecounter-bt" x="219" y="78" width="28" height="17" rx="6" fill="#d1d1d6" transform="rotate(45 233 86)"/><circle cx="148" cy="170" r="102" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="18"/><g id="timecounter-tk" stroke="rgba(255,255,255,.28)" stroke-width="5" stroke-linecap="round"></g><circle id="timecounter-an" cx="148" cy="170" r="102" fill="none" stroke-width="18" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" transform="rotate(-90 148 170)"/></svg><div id="timecounter-n"></div><div id="timecounter-r"></div><div id="timecounter-u"></div></div></div>
</div>
<script>
(function () {
  const C = (window.__scenes || {})["time-counter"] || { duration: 3.6 };
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  var D = C.duration || 3.6, t0 = 0;

  var P = {
    x: 540, // Card center on the 1080×1920 canvas, in pixels.
    y: 392, // Card center above the head, in pixels.
    label: "IN", // Small word preceding the unit.
    end: 5, // Stopwatch target value, counted from zero.
    unit: "MINUTES", // Large unit beside the number.
    color: "#ff6a1f", // Ring and unit color.
  };


  var LC = 720, HEIGHT_VALUE = 304, RX = 148, RY = 170;
  var g = function (s) { return document.getElementById("timecounter-" + s); };
  var anchor = g("a"), card = g("c"), num = g("n"), rot = g("r"), uni = g("u"), ring = g("an"), color = P.color || "#ff6a1f";
  anchor.style.left = P.x + "px"; anchor.style.top = P.y + "px";
  card.style.left = (-LC / 2) + "px"; card.style.top = (-HEIGHT_VALUE / 2) + "px";
  ring.setAttribute("stroke", color); uni.style.color = color;
  rot.textContent = String(P.label == null ? "" : P.label); uni.textContent = String(P.unit == null ? "" : P.unit);
  if (!rot.textContent) uni.style.top = "106px";

  var marks = g("tk"), ns = "http://www.w3.org/2000/svg";
  for (var im = 0; im < 12; im++) { var an = Math.PI * 2 * im / 12, li = document.createElementNS(ns, "line");
    li.setAttribute("x1", RX + Math.sin(an) * 78); li.setAttribute("y1", RY - Math.cos(an) * 78);
    li.setAttribute("x2", RX + Math.sin(an) * 86); li.setAttribute("y2", RY - Math.cos(an) * 86); marks.appendChild(li); }

  var raw = String(P.end == null ? "5" : P.end).trim(), dec = (raw.split(".")[1] || "").length;
  var target = parseFloat(raw.replace(/,/g, "")); if (isNaN(target)) target = 5;
  var formatValue = function (v) { var f = Math.abs(v).toFixed(dec).split("."); f[0] = f[0].replace(/\B(?=(\d{3})+(?!\d))/g, ","); return (v < 0 ? "-" : "") + f.join("."); };
  var end = formatValue(target);

  var adjust = function () {
    var before = num.textContent, free = LC - 288 - 30;
    num.textContent = end; num.style.fontSize = "128px"; var sp = document.createElement("span"); sp.textContent = end; num.textContent = ""; num.appendChild(sp);
    var wn = sp.offsetWidth; if (wn > 150) num.style.fontSize = (128 * 150 / wn) + "px"; num.textContent = before || formatValue(0);
    rot.style.fontSize = "42px"; if (rot.scrollWidth > free) rot.style.fontSize = (42 * free / rot.scrollWidth) + "px";
    uni.style.fontSize = "92px"; if (uni.scrollWidth > free) uni.style.fontSize = (92 * free / uni.scrollWidth) + "px";
  };
  num.textContent = formatValue(0); adjust(); if (document.fonts && document.fonts.status !== "loaded") document.fonts.ready.then(adjust);
  var k = Math.min(1, Math.max(.45, (D - .4) / 3.2)), enter = t0 + .05, exit = t0 + D - .3, countNumber = enter + .2, durC = 1.0 * k, closeAt = countNumber + durC;
  tl.fromTo(anchor, { opacity: 0 }, { opacity: 1, duration: .05, ease: "none" }, enter);
  tl.fromTo(card, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .38, ease: "back.out(1.6)" }, enter);
  tl.fromTo(uni, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: .35, ease: "power3.out" }, enter + .18);
  var o = { v: 0 };
  tl.fromTo(o, { v: 0 }, { v: target, duration: durC, ease: "power1.inOut", onUpdate: function () { num.textContent = formatValue(o.v); } }, countNumber);
  tl.fromTo(ring, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: durC, ease: "power1.inOut" }, countNumber);

  tl.fromTo(ring, { attr: { "stroke-width": 18 } }, { attr: { "stroke-width": 27 }, duration: .12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, closeAt);
  tl.fromTo("#timecounter-bt", { y: 0 }, { y: 4, duration: .08, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, closeAt - .04);
  tl.fromTo(num, { y: 0 }, { y: -10, duration: .12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, closeAt);

  var live = closeAt + .35, padding = exit - live, turns = Math.max(1, Math.round(padding / 1.1)), halfValue = padding / (turns * 2);
  if (halfValue > .12) tl.to(anchor, { y: -6, duration: halfValue, ease: "sine.inOut", yoyo: true, repeat: turns * 2 - 1, immediateRender: false }, live);
  tl.to(anchor, { opacity: 0, y: -28, duration: .26, ease: "power2.in", immediateRender: false }, exit);
  tl.to({}, { duration: D }, 0);
  window.__timelines["time-counter"] = tl;
})();
</script>
</template>
</body></html>
