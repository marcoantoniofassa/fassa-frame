<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><title>editonny · Transition tv</title></head>
<body>
<!-- Transition tv. For a section ending or a joke: the image closes into a line and opens again. -->

<template id="transition-tv-template">
<style>
#root{position:absolute;inset:0;overflow:hidden}
#transitiontv-a,#transitiontv-b{position:absolute;left:0;width:1080px;height:960px;background:#050506;opacity:0}
#transitiontv-a{top:0} #transitiontv-b{top:960px}
#transitiontv-l{position:absolute;left:0;top:952px;width:1080px;height:16px;background:#fff;box-shadow:0 0 40px 10px rgba(255,255,255,.9);opacity:0}
</style>
<div id="root" data-composition-id="transition-tv" data-width="1080" data-height="1920" data-duration="0.6">
<div id="transitiontv-a"></div><div id="transitiontv-b"></div><div id="transitiontv-l"></div>
</div>
<script>
(function () {
  const C = (window.__scenes || {})["transition-tv"] || { duration: 0.6 };
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  var D = 0.6, t0 = 0;

  function rise(sel, a, b, c, peak, e1, e2) {
    tl.fromTo(sel, { opacity: 0 }, { opacity: peak, duration: b - a, ease: e1 || "sine.inOut" }, t0 + a);
    tl.to(sel, { opacity: 0, duration: c - b, ease: e2 || "sine.inOut", immediateRender: false }, t0 + b);
  }

  tl.fromTo("#transitiontv-a", { opacity: 1, clipPath: "inset(0% 0% 100% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: D * .4, ease: "power3.in" }, t0);
  tl.fromTo("#transitiontv-b", { opacity: 1, clipPath: "inset(100% 0% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: D * .4, ease: "power3.in" }, t0);
  tl.fromTo("#transitiontv-l", { opacity: 0, clipPath: "inset(0% 0% 0% 0%)" }, { opacity: 1, duration: D * .08 }, t0 + D * .32);
  tl.to("#transitiontv-l", { clipPath: "inset(0% 50% 0% 50%)", duration: D * .12, ease: "power2.in", immediateRender: false }, t0 + D * .42);
  tl.to("#transitiontv-l", { opacity: 0, duration: .01, immediateRender: false }, t0 + D * .55);
  tl.to("#transitiontv-a", { clipPath: "inset(0% 0% 100% 0%)", duration: D * .4, ease: "power3.out", immediateRender: false }, t0 + D * .58);
  tl.to("#transitiontv-b", { clipPath: "inset(100% 0% 0% 0%)", duration: D * .4, ease: "power3.out", immediateRender: false }, t0 + D * .58);
  tl.to(["#transitiontv-a", "#transitiontv-b"], { opacity: 0, duration: .01, immediateRender: false }, t0 + D * .99);
  tl.to({}, { duration: D }, 0);
  window.__timelines["transition-tv"] = tl;
})();
</script>
</template>
</body></html>
