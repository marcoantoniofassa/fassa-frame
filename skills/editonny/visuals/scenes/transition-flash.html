<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><title>editonny · Transition flash</title></head>
<body>
<!-- Transition flash. For a sharp, emphatic cut: a short white flash peaks at the cut. -->

<template id="transition-flash-template">
<style>
#root{position:absolute;inset:0;overflow:hidden}
#transitionflash-bk{position:absolute;inset:0;backdrop-filter:blur(10px) brightness(1.6);-webkit-backdrop-filter:blur(10px) brightness(1.6);opacity:0}
#transitionflash-w{position:absolute;inset:0;background:#fff;opacity:0}
</style>
<div id="root" data-composition-id="transition-flash" data-width="1080" data-height="1920" data-duration="0.3">
<div id="transitionflash-bk"></div><div id="transitionflash-w"></div>
</div>
<script>
(function () {
  const C = (window.__scenes || {})["transition-flash"] || { duration: 0.3 };
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  var D = 0.3, t0 = 0;

  function rise(sel, a, b, c, peak, e1, e2) {
    tl.fromTo(sel, { opacity: 0 }, { opacity: peak, duration: b - a, ease: e1 || "sine.inOut" }, t0 + a);
    tl.to(sel, { opacity: 0, duration: c - b, ease: e2 || "sine.inOut", immediateRender: false }, t0 + b);
  }

  rise("#transitionflash-bk", D * .1, D * .5, D * .9, 1, "power2.in", "power2.out");
  rise("#transitionflash-w", D * .25, D * .5, D * .9, .96, "power2.in", "power2.out");
  tl.to({}, { duration: D }, 0);
  window.__timelines["transition-flash"] = tl;
})();
</script>
</template>
</body></html>
