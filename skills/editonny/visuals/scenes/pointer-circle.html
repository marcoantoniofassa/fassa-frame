<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><title>editonny · Pointer circle</title></head>
<body>
<!-- Pointer circle. To circle a number, face, button, or other detail. -->

<template id="pointer-circle-template">
<style>
@font-face{font-family:"Inter";src:url("assets/visuals/fonts/inter-var-latin.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"Inter";src:url("assets/visuals/fonts/inter-var-latin-ext.woff2") format("woff2");font-weight:100 900;font-display:block;unicode-range:U+0100-02BA,U+1E00-1E9F,U+20A0-20C0}
#root{position:absolute;inset:0;overflow:hidden;font-family:"Inter",sans-serif}
#pointercircle-a{position:absolute;left:0;top:0;width:10px;height:10px;opacity:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5)) drop-shadow(0 7px 12px rgba(0,0,0,.4))}
#pointercircle-s{position:absolute;left:0;top:0;overflow:visible}
.pointercircle-k{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round}
.pointercircle-b{fill:#fff;stroke:#fff;stroke-linejoin:round}
.pointercircle-f{stroke:none}
</style>
<div id="root" data-composition-id="pointer-circle" data-width="1080" data-height="1920" data-duration="2.4">
<div id="pointercircle-a"><svg id="pointercircle-s" xmlns="http://www.w3.org/2000/svg" width="10" height="10"><defs><mask id="pointercircle-m1" maskUnits="userSpaceOnUse"><path id="pointercircle-k1" class="pointercircle-k"/></mask><mask id="pointercircle-m2" maskUnits="userSpaceOnUse"><path id="pointercircle-k2" class="pointercircle-k"/></mask><mask id="pointercircle-n1" maskUnits="userSpaceOnUse"><path id="pointercircle-j1" class="pointercircle-k"/></mask><mask id="pointercircle-n2" maskUnits="userSpaceOnUse"><path id="pointercircle-j2" class="pointercircle-k"/></mask></defs><path id="pointercircle-b1" class="pointercircle-b" mask="url(#pointercircle-n1)"/><path id="pointercircle-b2" class="pointercircle-b" mask="url(#pointercircle-n2)"/><path id="pointercircle-f1" class="pointercircle-f" mask="url(#pointercircle-m1)"/><path id="pointercircle-f2" class="pointercircle-f" mask="url(#pointercircle-m2)"/></svg></div>
</div>
<script>
(function () {
  const C = (window.__scenes || {})["pointer-circle"] || { duration: 2.4 };
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  var D = C.duration || 2.4, t0 = 0;

  var P = {
    x: 540, // Target center on the 1080×1920 canvas, in pixels.
    y: 620, // Target center, in pixels.
    width: 420, // Circle width, in pixels.
    height: 260, // Circle height, in pixels; the final stroke extends about 25 pixels beyond it.
    color: "#ff3b30", // Stroke color.
    thickness: 14, // Stroke thickness, in pixels.
  };


  var esp = P.thickness, border = Math.max(3.5, esp * .17), body = esp + border * 2, rx = P.width / 2 - esp / 2, ry = P.height / 2 - esp / 2;
  var get = function (s) { return document.getElementById("pointercircle-" + s); };
  var box = get("a"); box.style.left = P.x + "px"; box.style.top = P.y + "px";
  var direction = function (pts, i) { var a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], m = Math.sqrt(dx * dx + dy * dy) || 1; return [dx / m, dy / m]; };

  var brush = function (pts, profileValue) {
    var n = pts.length, outbound = [], returnMotion = [], i, k, g, w, ang;
    for (i = 0; i < n; i++) { g = direction(pts, i); w = esp * profileValue(i / (n - 1)) / 2; outbound.push([pts[i][0] - g[1] * w, pts[i][1] + g[0] * w]); returnMotion.unshift([pts[i][0] + g[1] * w, pts[i][1] - g[0] * w]); }
    g = direction(pts, n - 1); w = esp * profileValue(1) / 2;
    for (k = 1; k < 8; k++) { ang = Math.PI * k / 8; outbound.push([pts[n - 1][0] + w * (-Math.cos(ang) * g[1] + Math.sin(ang) * g[0]), pts[n - 1][1] + w * (Math.cos(ang) * g[0] + Math.sin(ang) * g[1])]); }
    outbound = outbound.concat(returnMotion); g = direction(pts, 0); w = esp * profileValue(0) / 2;
    for (k = 1; k < 8; k++) { ang = Math.PI * k / 8; outbound.push([pts[0][0] + w * (Math.cos(ang) * g[1] - Math.sin(ang) * g[0]), pts[0][1] + w * (-Math.cos(ang) * g[0] - Math.sin(ang) * g[1])]); }
    return "M" + outbound.map(function (q) { return q[0].toFixed(1) + " " + q[1].toFixed(1); }).join("L") + "Z";
  };

  var track = function (pts, remainingValue) {
    var n = pts.length, g0 = direction(pts, 0), g1 = direction(pts, n - 1), allItems = [[pts[0][0] - g0[0] * remainingValue, pts[0][1] - g0[1] * remainingValue]].concat(pts, [[pts[n - 1][0] + g1[0] * remainingValue, pts[n - 1][1] + g1[1] * remainingValue]]), comp = 0, i;
    for (i = 1; i < allItems.length; i++) comp += Math.sqrt(Math.pow(allItems[i][0] - allItems[i - 1][0], 2) + Math.pow(allItems[i][1] - allItems[i - 1][1], 2));
    return { d: "M" + allItems.map(function (q) { return q[0].toFixed(1) + " " + q[1].toFixed(1); }).join("L"), comp: comp + 2 };
  };

  var comps = [], assemble = function (num, pts, profileValue, padding) {
    var tr = track(pts, esp * .75 + border + 4), q, maskValue; comps[num] = tr.comp + border + 10;
    for (q = 0; q < 2; q++) {
      maskValue = get((q ? "j" : "k") + num); maskValue.setAttribute("d", tr.d); maskValue.setAttribute("stroke-width", esp * 1.26 + border * 2 + 4);
      maskValue.setAttribute("stroke-dasharray", (tr.comp + q * border) + " " + (tr.comp + 200 + border)); maskValue.setAttribute("stroke-dashoffset", comps[num]);
      maskValue = get((q ? "n" : "m") + num); maskValue.setAttribute("x", -padding); maskValue.setAttribute("y", -padding); maskValue.setAttribute("width", padding * 2); maskValue.setAttribute("height", padding * 2);
    }
    get("b" + num).setAttribute("d", brush(pts, profileValue)); get("b" + num).setAttribute("stroke-width", border * 2);
    get("f" + num).setAttribute("d", brush(pts, profileValue)); get("f" + num).setAttribute("fill", P.color);
  };

  var total = 140, cut = 72, rotation = 398 * Math.PI / 180, topple = -3 * Math.PI / 180;

  var start = (-112 - 50 * Math.max(0, Math.min(1, ry / rx - 1))) * Math.PI / 180;

  var smaller = Math.min(rx, ry), inside = Math.min(body * .9, smaller * .16), passThrough = Math.max(body * 1.05, Math.min(body * 1.4, smaller * .3));
  var returnMotion = function (phaseValue) {
    var list = [], i, u, ang, nx, ny, nm, outside, px, py;
    for (i = 0; i <= total; i++) {
      u = i / total; ang = start + rotation * u; nx = Math.cos(ang) / rx; ny = Math.sin(ang) / ry; nm = Math.sqrt(nx * nx + ny * ny);
      outside = -inside * Math.pow(Math.max(0, 1 - u / .22), 2) + passThrough * Math.pow(Math.max(0, (u - .8) / .2), 1.5) + smaller * (.022 * Math.sin(2 * ang + .6) + .014 * Math.sin(3 * ang + 2)) + (phaseValue ? 1.6 * Math.sin(5 * ang + phaseValue) : 0);
      px = rx * Math.cos(ang) + nx / nm * outside; py = ry * Math.sin(ang) + ny / nm * outside;
      list.push([px * Math.cos(topple) - py * Math.sin(topple), px * Math.sin(topple) + py * Math.cos(topple)]);
    }
    return list;
  };

  var pen = function (v) { return (.72 + .28 * Math.min(1, v / .05)) * (1 + .12 * Math.sin(Math.PI * Math.min(1, v / .9))) * (1 - .36 * Math.pow(Math.max(0, (v - .88) / .12), 1.5)) * (1 + .03 * Math.sin(v * 21)); };
  var half1 = function (w) { return pen(w * (cut + 2) / total); }, secondHalf = function (w) { return pen((cut - 2 + w * (total - cut + 2)) / total); };
  var pts = returnMotion(0), padding = Math.max(P.width, P.height) + 80, shapes, k, anotherItem;
  assemble(1, pts.slice(0, cut + 3), half1, padding); assemble(2, pts.slice(cut - 2), secondHalf, padding);
  shapes = [[get("f1").getAttribute("d"), get("f2").getAttribute("d")]];
  for (k = 1; k < 3; k++) { anotherItem = returnMotion(k * 2.1); shapes.push([brush(anotherItem.slice(0, cut + 3), half1), brush(anotherItem.slice(cut - 2), secondHalf)]); }

  var enter = t0 + .05, landItem = enter + .45, exit = t0 + D - .3, impact = .13, count = Math.max(2, Math.floor((exit - landItem - .1) / impact)), j;
  tl.fromTo("#pointercircle-a", { opacity: 0 }, { opacity: 1, duration: .04, ease: "none" }, enter);
  tl.fromTo("#pointercircle-k1, #pointercircle-j1", { strokeDashoffset: comps[1] }, { strokeDashoffset: 0, duration: .16, ease: "none" }, enter);
  tl.fromTo("#pointercircle-k2, #pointercircle-j2", { strokeDashoffset: comps[2] }, { strokeDashoffset: 0, duration: .29, ease: "power1.out" }, enter + .16);
  for (j = 0; j < count; j++) {
    k = j === count - 1 ? 0 : (j + 1) % 3;
    tl.set("#pointercircle-b1, #pointercircle-f1", { attr: { d: shapes[k][0] }, immediateRender: false }, landItem + .1 + j * impact);
    tl.set("#pointercircle-b2, #pointercircle-f2", { attr: { d: shapes[k][1] }, immediateRender: false }, landItem + .1 + j * impact);
  }
  tl.to("#pointercircle-a", { opacity: 0, duration: .25, ease: "power2.in", immediateRender: false }, exit);
  tl.to({}, { duration: D }, 0);
  window.__timelines["pointer-circle"] = tl;
})();
</script>
</template>
