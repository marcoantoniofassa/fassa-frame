  var measure = function (txt, style, px) {

  var fit = function (txt, style, maxPx, minPx, widthValue) { var w = measure(txt, style, maxPx); return Math.max(minPx, Math.floor(w > widthValue ? maxPx * widthValue / w : maxPx)); };
  var PT = "font-family:PlayfairI,serif;font-weight:500;letter-spacing:-.01em", SN = "font-family:SoraV,sans-serif;font-weight:600;letter-spacing:-.03em";

    var syllable = function (w) {

      for (var j = 1; j < w.length - 1; j++) {

        else cand(j);
      }
      return best < 0 ? null : [w.slice(0, best) + "-", w.slice(best)];

        l2 = [txt.slice(0, best), txt.slice(best + 1)];
      } else l2 = syllable(txt);
      if (l2) two = Math.min(38, fit(l2[0], SN, 38, 14, widthValue), fit(l2[1], SN, 38, 14, widthValue));
      return { txt: txt, oneValue: oneValue, l2: l2, two: two };

    var PX = Math.min.apply(null, options.map(function (o) { return Math.max(o.oneValue, o.two); }));
