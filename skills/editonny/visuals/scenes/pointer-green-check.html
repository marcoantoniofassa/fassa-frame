<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><title>editonny · Pointer green check</title></head>

<!-- Pointer green check. To confirm, approve, or mark an item as completed. -->

<template id="pointer-green-check-template">
<style>
@font-face{font-family:"Inter";src:url("assets/visuals/fonts/inter-var-latin.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"Inter";src:url("assets/visuals/fonts/inter-var-latin-ext.woff2") format("woff2");font-weight:100 900;font-display:block;unicode-range:U+0100-02BA,U+1E00-1E9F,U+20A0-20C0}
#root{position:absolute;inset:0;overflow:hidden;font-family:"Inter",sans-serif}
#pointergreencheck-a{position:absolute;left:0;top:0;width:10px;height:10px;opacity:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5)) drop-shadow(0 7px 12px rgba(0,0,0,.4))}
#pointergreencheck-s{position:absolute;left:0;top:0;overflow:visible}
.pointergreencheck-k{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round}
.pointergreencheck-b{fill:#fff;stroke:#fff;stroke-linejoin:round}
.pointergreencheck-f{stroke:none}
</style>
<div id="root" data-composition-id="pointer-green-check" data-width="1080" data-height="1920" data-duration="2.0">
<div id="pointergreencheck-a"><svg id="pointergreencheck-s" xmlns="http://www.w3.org/2000/svg" width="10" height="10"><defs><mask id="pointergreencheck-m1" maskUnits="userSpaceOnUse"><path id="pointergreencheck-k1" class="pointergreencheck-k"/></mask><mask id="pointergreencheck-m2" maskUnits="userSpaceOnUse"><path id="pointergreencheck-k2" class="pointergreencheck-k"/></mask><mask id="pointergreencheck-n1" maskUnits="userSpaceOnUse"><path id="pointergreencheck-j1" class="pointergreencheck-k"/></mask><mask id="pointergreencheck-n2" maskUnits="userSpaceOnUse"><path id="pointergreencheck-j2" class="pointergreencheck-k"/></mask></defs><path id="pointergreencheck-b1" class="pointergreencheck-b" mask="url(#pointergreencheck-n1)"/><path id="pointergreencheck-b2" class="pointergreencheck-b" mask="url(#pointergreencheck-n2)"/><path id="pointergreencheck-f1" class="pointergreencheck-f" mask="url(#pointergreencheck-m1)"/><path id="pointergreencheck-f2" class="pointergreencheck-f" mask="url(#pointergreencheck-m2)"/></svg></div>
</div>
<script>
(function () {
  const C = (window.__scenes || {})["pointer-green-check"] || { duration: 2.0 };
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  var D = C.duration || 2.0, t0 = 0;

  var P = {
    x: 540, // Check-mark center on the 1080×1920 canvas, in pixels.
    y: 620, // Check-mark center, in pixels.
    size: 260, // Check-mark width, in pixels.
    color: "#30d158", // Stroke color.
  };


  var widthValue = P.size, alt = widthValue * .78, esp = widthValue * .166, border = Math.max(3.5, esp * .17);
  var get = function (s) { return document.getElementById("pointergreencheck-" + s); };
  var box = get("a"); box.style.left = P.x + "px"; box.style.top = P.y + "px";

  var curve = function (a, b, belly, n) {
    var list = [], i, u, cx = (a[0] + b[0]) / 2 - (b[1] - a[1]) * belly, cy = (a[1] + b[1]) / 2 + (b[0] - a[0]) * belly;
    for (i = 0; i <= n; i++) { u = i / n; list.push([(1 - u) * (1 - u) * a[0] + 2 * u * (1 - u) * cx + u * u * b[0], (1 - u) * (1 - u) * a[1] + 2 * u * (1 - u) * cy + u * u * b[1]]); }
    return list;
  };
  var direction = function (pts, i) { var a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], m = Math.sqrt(dx * dx + dy * dy) || 1; return [dx / m, dy / m]; };

  var brush = function (pts, profileValue) {
    var n = pts.length, outbound = [], returnMotion = [], i, k, g, w, ang;
    for (i = 0; i < n; i++) { g = direction(pts, i); w = esp * profileValue(i / (n - 1)) / 2; outbound.push([pts[i][0] - g[1] * w, pts[i][1] + g[0] * w]); returnMotion.unshift([pts[i][0] + g[1] * w, pts[i][1] - g[0] * w]); }
    g = direction(pts, n - 1); w = esp * profileValue(1) / 2;
    for (k = 1; k < 8; k++) { ang = Math.PI * k / 8; outbound.push([pts[n - 1][0] + w * (-Math.cos(ang) * g[1] + Math.sin(ang) * g[0]), pts[n - 1][1] + w * (Math.cos(ang) * g[0] + Math.sin(ang) * g[1])]); }
    outbound = outbound.concat(returnMotion); g = direction(pts, 0); w = esp * profileValue(0) / 2;
    for (k = 1; k < 8; k++) { ang = Math.PI * k / 8; outbound.push([pts[0][0] + w * (Math.cos(ang) * g[1] - Math.sin(ang) * g[0]), pts[0][1] + w * (-Math.cos(ang) * g[0] - Math.sin(ang) * g[1])]); }
    return "M" + outbound.map(function (q) { return q[0].toFixed(1) + " " + q[1].toFixed(1); }).join("L") + "Z";
  };

  var track = function (pts, remainingValue) {
    var n = pts.length, g0 = direction(pts, 0), g1 = direction(pts, n - 1), allItems = [[pts[0][0] - g0[0] * remainingValue, pts[0][1] - g0[1] * remainingValue]].concat(pts, [[pts[n - 1][0] + g1[0] * remainingValue, pts[n - 1][1] + g1[1] * remainingValue]]), comp = 0, i;
    for (i = 1; i < allItems.length; i++) comp += Math.sqrt(Math.pow(allItems[i][0] - allItems[i - 1][0], 2) + Math.pow(allItems[i][1] - allItems[i - 1][1], 2));
    return { d: "M" + allItems.map(function (q) { return q[0].toFixed(1) + " " + q[1].toFixed(1); }).join("L"), comp: comp + 2 };
  };

  var comps = [], assemble = function (num, pts, profileValue, padding) {
    var tr = track(pts, esp * .75 + border + 4), q, maskValue; comps[num] = tr.comp + border + 10;
    for (q = 0; q < 2; q++) {
      maskValue = get((q ? "j" : "k") + num); maskValue.setAttribute("d", tr.d); maskValue.setAttribute("stroke-width", esp * 1.26 + border * 2 + 4);
      maskValue.setAttribute("stroke-dasharray", (tr.comp + q * border) + " " + (tr.comp + 200 + border)); maskValue.setAttribute("stroke-dashoffset", comps[num]);
      maskValue = get((q ? "n" : "m") + num); maskValue.setAttribute("x", -padding); maskValue.setAttribute("y", -padding); maskValue.setAttribute("width", padding * 2); maskValue.setAttribute("height", padding * 2);
    }
    get("b" + num).setAttribute("d", brush(pts, profileValue)); get("b" + num).setAttribute("stroke-width", border * 2);
    get("f" + num).setAttribute("d", brush(pts, profileValue)); get("f" + num).setAttribute("fill", P.color);
  };

  var nozzle = [-widthValue * .13, alt / 2 - border - esp * .54];
  assemble(1, curve([-widthValue / 2 + border + esp * .4, -alt * .03], nozzle, .03, 16), function (u) { return (.8 + .28 * Math.sin(Math.PI * Math.min(1, u / .6) / 2)) * (1 + .03 * Math.sin((1 - u) * 6)); }, widthValue);
  assemble(2, curve(nozzle, [widthValue / 2 - border - esp * .31, -alt / 2 + border + esp * .31], .05, 30), function (u) { return 1.08 * (1 - .45 * Math.pow(Math.max(0, (u - .3) / .7), 1.5)) * (1 + .03 * Math.sin(u * 8)); }, widthValue);

  var enter = t0 + .05, landItem = enter + .3, exit = t0 + D - .3, jumpEnd = landItem + .3, j;
  tl.fromTo("#pointergreencheck-a", { opacity: 0 }, { opacity: 1, duration: .04, ease: "none" }, enter);
  tl.fromTo("#pointergreencheck-k1, #pointergreencheck-j1", { strokeDashoffset: comps[1] }, { strokeDashoffset: 0, duration: .1, ease: "power1.in" }, enter);
  tl.fromTo("#pointergreencheck-k2, #pointergreencheck-j2", { strokeDashoffset: comps[2] }, { strokeDashoffset: 0, duration: .2, ease: "power2.out" }, enter + .1);
  tl.to("#pointergreencheck-a", { y: -18, duration: .09, ease: "power2.out", immediateRender: false }, landItem);
  tl.to("#pointergreencheck-a", { y: 0, duration: .21, ease: "bounce.out", immediateRender: false }, landItem + .09);

  var count = Math.max(0, Math.floor((exit - jumpEnd) / .85));
  for (j = 0; j < count; j++) { tl.to("#pointergreencheck-a", { y: -10, duration: .1, ease: "power2.out", immediateRender: false }, jumpEnd + .55 + j * .85); tl.to("#pointergreencheck-a", { y: 0, duration: .14, ease: "power2.in", immediateRender: false }, jumpEnd + .65 + j * .85); }
  tl.to("#pointergreencheck-a", { opacity: 0, duration: .25, ease: "power2.in", immediateRender: false }, exit);
  tl.to({}, { duration: D }, 0);
  window.__timelines["pointer-green-check"] = tl;
})();
</script>
</template>
</body></html>
