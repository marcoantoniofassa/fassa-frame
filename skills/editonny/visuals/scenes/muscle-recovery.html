  ];
  var names = String(P.recoveryItems || "").split("|").map(function (s) { return s.trim(); }).filter(Boolean).slice(0, 4);
  var its = pe("its"), N = Math.max(1, names.length), GAP = 14, items = [];
  names.forEach(function (nm, q) {

  var measure = function (el, w) {

    document.body.appendChild(c); var r = c.getBoundingClientRect(); document.body.removeChild(c); return r;
  };
  var fit = function () {

      else if (w1 > TW) { fs = 56; lin = 2; t.style.fontSize = fs + "px"; for (var g = 0; g < 14 && measure(t, TW).height > fs * .96 * 2 + 6; g++) { fs = Math.max(38, fs * .94); t.style.fontSize = fs + "px"; } }
      t.style.fontSize = fs + "px"; tb = Math.max(tb, 24 + fs * .96 * lin);

    var EXTRA = 10 + 46 + 10 + 20, widths = items.map(function (it) {

    var sum = function (a, b) { return widths.slice(a, b).reduce(function (x, y) { return x + y; }, 0) + GAP * Math.max(0, b - a - 1); };
    var lines = sum(0, N) <= TW ? [[0, N]] : [[0, Math.ceil(N / 2)], [Math.ceil(N / 2), N]];
    var two = lines.length > 1, HEIGHT_VALUE = two ? 58 : 62, tops = two ? [282, 350] : [346];
    var free = tops[0] - tb; CY = tb + free / 2 + 4; HMAX = Math.min(84, (free / 2 - 8) / 1.33); H0 = HMAX * .6; draw();
    pe("hli").setAttribute("transform", "translate(706 " + (CY - 26) + ") rotate(-18)");

    lines.forEach(function (ln, r) {

      for (var q = ln[0]; q < ln[1]; q++) {

        if (f < 1) s.style.fontSize = Math.max(26, 38 * (lw - EXTRA) / (widths[q] - EXTRA)) + "px";

        x += lw + GAP;

  };
  fit(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fit(); tl.invalidate(); });

  var enter = t0 + .05, exit = t0 + D - .3, switchTime = enter + Math.max(.95, (D - .35) * .4);
