    { text: "You", t: 0.10, end: 0.34 }, { text: "do not", t: 0.36, end: 0.58 }, { text: "need", t: 0.60, end: 0.98 },

  var SCALE_FACTOR = (function () {
    var e = (typeof HIDDEN_RANGES !== "undefined" && HIDDEN_RANGES) || [], b0 = (typeof C.start === "number") ? C.start : 0, o = [], k;
    for (k = 0; k < e.length; k++) if (Number(e[k][1]) > Number(e[k][0])) o.push([Number(e[k][0]) - b0, Number(e[k][1]) - b0]);
    return o;
  })();
  function hidden(t) { for (var k = 0; k < SCALE_FACTOR.length; k++) if (t >= SCALE_FACTOR[k][0] && t < SCALE_FACTOR[k][1]) return true; return false; }
  function nextScale(t) { var r = Infinity, k; for (k = 0; k < SCALE_FACTOR.length; k++) if (SCALE_FACTOR[k][0] > t && SCALE_FACTOR[k][0] < r) r = SCALE_FACTOR[k][0]; return r; }

  function num(v, defaultValue) { return (v === "" || v == null || !isFinite(Number(v))) ? defaultValue : Number(v); }

  var yy = Math.max(230 + sizeValue * 0.8, Math.min(1530 - sizeValue * 0.92, num(P.y, 1280))), span = 0.27, radius = 0.12, util = 800 - sizeValue * 0.53, rise = Math.round(sizeValue * 0.18);

    var dx = bx - ax, dy = by - ay, L = Math.sqrt(dx * dx + dy * dy), a0 = L ? Math.atan2(dy, dx) : 0, step = 1.4 / px, pts = [], k, a, f;
    var n = Math.max(8, Math.min(34, Math.ceil(Math.PI * r / step))), m = L ? Math.max(1, Math.min(30, Math.ceil(L / step))) : 0;
    for (k = 0; k < (L ? n + 1 : 2 * n); k++) { a = a0 - Math.PI / 2 + Math.PI * k / n; pts.push([bx + r * Math.cos(a), by + r * Math.sin(a)]); }

    for (k = 1; k < m; k++) {

    for (k = 0; k < pts.length; k++) pts[k] = pts[k][0].toFixed(3) + "em " + pts[k][1].toFixed(3) + "em 0 " + color;
    return pts.join(",");
  }

  function withoutJump(list) {
    var all = [], out = [], k = 0, i, p, w, u;
    function fits(pals) { return pals.length <= maxP + 2 && util / atStart(pals) >= sizeValue * 0.6; }
    for (i = 0; i < W.length; i++) if (show(W[i].text) && W[i].t < D - 0.2) all.push(W[i]);
    for (i = 0; i <= list.length; i++) {
      p = i < list.length ? list[i].words[0] : null;
      while (k < all.length && !(p && show(all[k].text) === p.text && Math.max(0.05, all[k].t) === p.t)) {
        w = all[k++]; w = { text: show(w.text), t: Math.max(0.05, w.t), end: Math.min(D - 0.05, Math.max(w.t + 0.08, w.end)) };
        u = out.length ? out[out.length - 1] : null;

      }

    line.style.top = Math.round(yy - sizeValue * 1.5) + "px"; line.style.height = Math.round(sizeValue * 3) + "px"; line.style.fontSize = tt + "px"; line.style.color = cl; line.style.textShadow = shadow;
