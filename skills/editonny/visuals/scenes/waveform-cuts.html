<script>
(function () {

  var D = C.duration || 4.5, t0 = 0;

  var P = {
    x: 540, // Card center on the 1080×1920 canvas, in pixels.
    y: 240, // Card top above the head, in pixels; card height is 378 pixels.
    pauses: 5, // Number of removed pauses, from one to twelve.

  var anchor = document.getElementById("waveformcuts-a"), card = document.getElementById("waveformcuts-c"), header = document.getElementById("waveformcuts-h"), cont = document.getElementById("waveformcuts-k");

  var items = [], leftValue = 0, settled = 0, mergeItems = [], indent = [];
  for (i = 0; i <= nP; i++) {
    var bl = document.createElement("div"); bl.className = "waveformcuts-g"; bl.style.left = leftValue + "px"; bl.style.width = characterWidth[i] + "px";
    var sv = el("svg", { width: Math.ceil(characterWidth[i]), height: AH }); sv.style.position = "absolute"; sv.style.left = "0"; sv.style.top = "0";
    for (var bx = Math.ceil(leftValue / 9) * 9 + 3; bx < leftValue + characterWidth[i] - 6; bx += 9) { var h = 8 + 104 * wave(bx / 9); sv.appendChild(el("rect", { x: bx - leftValue, y: AH / 2 - h / 2, width: 5, height: h, rx: 2.5, fill: "#f2f2f7" })); }
    bl.appendChild(sv); track.appendChild(bl); items.push(bl); leftValue += characterWidth[i]; settled += characterWidth[i];
    if (i < nP) {
      var px = document.createElement("div"); px.className = "waveformcuts-x"; px.style.left = leftValue + "px"; px.style.width = extraWidth[i] + "px";
      var sx = el("svg", { width: Math.ceil(extraWidth[i]), height: AH }); sx.style.position = "absolute"; sx.style.left = "0"; sx.style.top = "0";
      sx.appendChild(el("rect", { x: 6, y: AH / 2 - 2.5, width: Math.max(1, extraWidth[i] - 16), height: 5, rx: 2.5, fill: "rgba(255,170,160,.95)" }));
      px.appendChild(sx); track.appendChild(px); items.push(px); mergeItems.push(settled); indent.push(leftValue - settled); leftValue += extraWidth[i];
    }
  }
  var flashes = mergeItems.map(function (q) { var f = document.createElement("div"); f.className = "waveformcuts-f"; f.style.left = q + "px"; track.appendChild(f); return f; });

  var measure = function (txt, style) {
    if (!document.body) return txt.length * 40;
    var s = document.createElement("span"); s.style.cssText = "position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap;font-family:Inter;font-variant-numeric:tabular-nums;" + style;
    s.textContent = txt; document.body.appendChild(s); var w = s.getBoundingClientRect().width; document.body.removeChild(s); return w;
  };
  var offset = 0, LB = 64, LD = 100, GAP = 26, SW = 64;
  var adjust = function () {
    var wb = measure(previousText, "font-size:64px;font-weight:800;letter-spacing:-.03em");
    var wd = Math.max(measure(followingText, "font-size:100px;font-weight:900;letter-spacing:-.04em"), countNumber ? 0 : measure(previousText, "font-size:100px;font-weight:900;letter-spacing:-.04em"));
    var tot = wb + GAP + SW + GAP + wd, f = Math.min(1, (LW - 16) / tot), l0 = (LW - tot * f) / 2, fd = LD * f;
    beforeElement.style.fontSize = (LB * f) + "px"; afterElement.style.fontSize = fd + "px";
    beforeElement.style.left = l0 + "px"; beforeElement.style.top = ((LD - LB) * f * .74) + "px";
    arrow.style.left = (l0 + (wb + GAP) * f) + "px"; arrow.style.top = (fd * .52 - 22 * f) + "px";
    arrow.setAttribute("width", SW * f); arrow.setAttribute("height", 44 * f);
    var dl = l0 + (wb + GAP + SW + GAP) * f; afterElement.style.left = dl + "px"; afterElement.style.top = "0px";
    offset = (LW - wd * f) / 2 - dl;
    var bw = wb * f, by = LB * f * .5;
    strokeSvg.setAttribute("width", bw + 12); strokeSvg.setAttribute("height", LB * f);
    strike.setAttribute("d", "M-6 " + (by + 3) + "L" + (bw + 6) + " " + (by - 3)); strike.setAttribute("stroke-width", Math.max(4, 7 * f));
    header.style.fontSize = "32px";
  };
  adjust(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { adjust(); tl.invalidate(); });

  var k = Math.min(1, Math.max(.45, (D - .4) / 4.1)), enter = t0 + .05, exit = t0 + D - .28, badge = exit - (.95 * k + .1);
  var c0 = enter + .7 * k + .1, c1 = badge - .2, step = (c1 - c0) / nP, dc = Math.max(.08, Math.min(.26, step * .7));
  tl.fromTo(anchor, { opacity: 0 }, { opacity: 1, duration: .05, ease: "none" }, enter);
  tl.fromTo(card, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .42, ease: "back.out(1.5)" }, enter);
  tl.fromTo(header, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: .3, ease: "power3.out" }, enter + .1);
  tl.fromTo(cont, { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: .3, ease: "power3.out" }, enter + .14);
  tl.fromTo(track, { clipPath: "inset(0px " + LW + "px 0px 0px)" }, { clipPath: "inset(0px 0px 0px 0px)", duration: .42 * k, ease: "power2.out" }, enter + .12);
  tl.fromTo(afterElement, { opacity: 0, x: function () { return offset; }, y: 18 }, { opacity: 1, x: function () { return offset; }, y: 0, duration: .32, ease: "power3.out" }, enter + .2);
  var marks = items.filter(function (e, j) { return j % 2 === 1; });
  marks.forEach(function (m, c) { tl.fromTo(m, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: .2, ease: "back.out(2)" }, enter + .32 * k + .05 * c); });

  var objectTime = { v: countNumber ? sA : 0 }, typingTime = function () { afterElement.textContent = countNumber ? mmss(objectTime.v) : (objectTime.v > .5 ? followingText : previousText); };
  typingTime();
  var remaining = countNumber ? sA : 0, perPause = countNumber ? (sA - sD) / spp : 0, when = [];
  marks.forEach(function (m, c) {
    var q = c0 + step * c + step * .25, right = items.slice(2 * c + 2), w = extraWidth[c];
    when.push(q);
    tl.fromTo(m, { backgroundColor: "rgba(255,59,48,.24)" }, { backgroundColor: "rgba(255,59,48,.6)", duration: .1, ease: "none", immediateRender: false }, q - .1);

    tl.fromTo(right, { x: -indent[c] }, { x: -(indent[c] + w), duration: dc, ease: "power3.inOut", immediateRender: false }, q);
    tl.fromTo(flashes[c], { opacity: 0 }, { opacity: 1, duration: .05, ease: "none" }, q + dc * .7);
    tl.fromTo(flashes[c], { opacity: 1 }, { opacity: 0, duration: .26, ease: "power2.out", immediateRender: false }, q + dc * .7 + .05);
    if (countNumber) { var start = remaining, end = c === nP - 1 ? sD : remaining - pp[c] * perPause; remaining = end;
      tl.fromTo(objectTime, { v: start }, { v: end, duration: dc, ease: "power2.out", onUpdate: typingTime, immediateRender: false }, q); }
  });

  var shown = -1, typingCount = function (n) { if (n === shown) return; shown = n; cont.textContent = n + " de " + nP; };
  typingCount(0);
  var rel = { v: 0 }, contentEnd = when.map(function (q) { return q + dc * .2; });
  tl.fromTo(rel, { v: 0 }, { v: 1, duration: c1 - c0 + .3, ease: "none", onUpdate: function () { var tt = c0 + rel.v * (c1 - c0 + .3), n = 0; for (var c = 0; c < contentEnd.length; c++) if (contentEnd[c] <= tt) n++; typingCount(n); } }, c0);

  if (!countNumber) tl.fromTo(objectTime, { v: 0 }, { v: 1, duration: .05, ease: "none", onUpdate: typingTime, immediateRender: false }, badge - .1);
  tl.fromTo(afterElement, { color: "#ffffff" }, { color: color, duration: .2, ease: "none", immediateRender: false }, badge - .05);
  tl.fromTo(afterElement, { x: function () { return offset; } }, { x: 0, duration: .4, ease: "power3.out", immediateRender: false }, badge);
  tl.fromTo(beforeElement, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: .3, ease: "power3.out" }, badge + .08);
  tl.fromTo(arrow, { opacity: 0 }, { opacity: 1, duration: .1, ease: "none" }, badge + .16);

  tl.fromTo(afterElement, { y: 0 }, { y: -10, duration: .1, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, badge + .32);
