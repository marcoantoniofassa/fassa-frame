    if (PARAM.exit > 0) tl.fromTo(["#terminal-background", "#terminal-layout"], { opacity: 1 }, { opacity: 0, duration: PARAM.exit, ease: "power1.in", immediateRender: false }, Math.max(0, DUR - PARAM.exit));
    window.__timelines["terminal"] = tl;
  };
  (document.fonts && document.fonts.load ? Promise.all([document.fonts.load(`800 ${Math.round(fs)}px Montserrat`), document.fonts.load(`900 ${Math.round(fsS)}px Montserrat`)]) : Promise.resolve()).then(build, build);
})();
</script>
</template>
