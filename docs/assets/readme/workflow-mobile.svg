<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1070" viewBox="0 0 760 1070" role="img" aria-labelledby="title description"><title id="title">One request, a complete workflow</title><desc id="description">Mobile view of directing, editing, reviewing, and exporting. Four cards appear once, with no movement for reduced-motion preferences.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#242721}.serif{font-family:Georgia,'Times New Roman',serif;font-style:italic}.mono{font-family:'Courier New',monospace;letter-spacing:2px}.muted{fill:#66695e}.paper{fill:#f4f3ed}.lime{fill:#d6f66b}.arrive{animation:arrive .8s cubic-bezier(.2,.7,.2,1) both}.caption{animation:arrive .6s ease-out .8s both}.playhead{animation:scan 4s cubic-bezier(.2,.5,.3,1) .4s both}.wave{animation:breathe 1.1s ease-in-out .5s 3}.orbit{transform-box:fill-box;transform-origin:center;animation:turn 4.4s ease-out both}.step{animation:arrive .7s ease-out both}.two{animation-delay:.4s}.three{animation-delay:.8s}.four{animation-delay:1.2s}.trace{animation:trace 3.8s ease-out .3s both}@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes scan{from{transform:translateX(-390px)}to{transform:translateX(0)}}@keyframes breathe{0%,100%{opacity:.65}50%{opacity:1}}@keyframes turn{from{transform:rotate(-14deg)}to{transform:rotate(0)}}@keyframes trace{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="760" height="1070" rx="12" fill="#f4f3ed"/><text x="48" y="67" font-size="44" class="" font-weight="650" letter-spacing="-2">One request.</text><text x="48" y="114" font-size="44" class="serif" letter-spacing="-1.5">A complete workflow.</text><g class="step "><rect x="48" y="146" width="664" height="202" rx="10" fill="#e7e9df" stroke="#d8dbcf"/><text x="78" y="190" font-size="22" class="mono muted" >01 / DIRECT</text><text x="78" y="254" font-size="38" class="" font-weight="650" letter-spacing="-1">A request. Your intent.</text><text x="78" y="304" font-size="28" class="muted" >Goal + footage + rhythm.</text><path d="M651 180v25m-8-8 8 8 8-8" fill="none" stroke="#7b8e60" stroke-width="2"/></g><g class="step two"><rect x="48" y="368" width="664" height="202" rx="10" fill="#e7e9df" stroke="#d8dbcf"/><text x="78" y="412" font-size="22" class="mono muted" >02 / EDIT</text><text x="78" y="476" font-size="38" class="" font-weight="650" letter-spacing="-1">Keep what matters.</text><text x="78" y="526" font-size="28" class="muted" >Cuts + captions + audio.</text><path d="M651 402v25m-8-8 8 8 8-8" fill="none" stroke="#7b8e60" stroke-width="2"/></g><g class="step three"><rect x="48" y="590" width="664" height="202" rx="10" fill="#e7e9df" stroke="#d8dbcf"/><text x="78" y="634" font-size="22" class="mono muted" >03 / REVIEW</text><text x="78" y="698" font-size="38" class="" font-weight="650" letter-spacing="-1">See the first cut.</text><text x="78" y="748" font-size="28" class="muted" >A representative sample.</text><path d="M651 624v25m-8-8 8 8 8-8" fill="none" stroke="#7b8e60" stroke-width="2"/></g><g class="step four"><rect x="48" y="812" width="664" height="202" rx="10" fill="#e7e9df" stroke="#d8dbcf"/><text x="78" y="856" font-size="22" class="mono muted" >04 / EXPORT</text><text x="78" y="920" font-size="38" class="" font-weight="650" letter-spacing="-1">Finish the story.</text><text x="78" y="970" font-size="28" class="muted" >Checked MP4 + project.</text><path d="M651 846v25m-8-8 8 8 8-8" fill="none" stroke="#7b8e60" stroke-width="2"/></g></svg>
