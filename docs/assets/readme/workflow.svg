<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="452" viewBox="0 0 1600 452" role="img" aria-labelledby="title description">
<title id="title">From request to checked export</title><desc id="description">Four stages of the local editing workflow: direct, edit, review, and export. Staggered entrances finish within two seconds; all information remains visible without animation.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#242721}.serif{font-family:Georgia,'Times New Roman',serif;font-style:italic}.mono{font-family:'Courier New',monospace;letter-spacing:2px}.muted{fill:#66695e}.paper{fill:#f4f3ed}.lime{fill:#d6f66b}.arrive{animation:arrive .8s cubic-bezier(.2,.7,.2,1) both}.caption{animation:arrive .6s ease-out .8s both}.playhead{animation:scan 4s cubic-bezier(.2,.5,.3,1) .4s both}.wave{animation:breathe 1.1s ease-in-out .5s 3}.orbit{transform-box:fill-box;transform-origin:center;animation:turn 4.4s ease-out both}.step{animation:arrive .7s ease-out both}.two{animation-delay:.4s}.three{animation-delay:.8s}.four{animation-delay:1.2s}.trace{animation:trace 3.8s ease-out .3s both}@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes scan{from{transform:translateX(-390px)}to{transform:translateX(0)}}@keyframes breathe{0%,100%{opacity:.65}50%{opacity:1}}@keyframes turn{from{transform:rotate(-14deg)}to{transform:rotate(0)}}@keyframes trace{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="1600" height="452" rx="12" fill="#f4f3ed"/><text x="64" y="79" font-size="49" class="" font-weight="650" letter-spacing="-2">One request. A complete workflow.</text><text x="1536" y="74" font-size="13" class="mono muted" text-anchor="end">YOU DIRECT. YOUR AI EDITS.</text><g class="step "><rect x="64" y="134" width="344" height="270" rx="8" fill="#e7e9df" stroke="#d8dbcf"/><text x="90" y="174" font-size="14" class="mono muted" >01 / DIRECT</text><rect x="90" y="202" width="286" height="68" rx="8" fill="#f4f3ed" stroke="#b7c2a7"/><text x="109" y="232" font-size="18" class="mono" font-weight="700">$editonny</text><text x="109" y="254" font-size="16" class="muted" >Edit this video…</text><text x="90" y="326" font-size="25" class="" font-weight="700" letter-spacing="-.8">A request. Your intent.</text><text x="90" y="364" font-size="18" class="muted" >Goal + footage + rhythm.</text></g><g class="step two"><rect x="440" y="134" width="344" height="270" rx="8" fill="#e7e9df" stroke="#d8dbcf"/><text x="466" y="174" font-size="14" class="mono muted" >02 / EDIT</text><rect x="468" y="206" width="95" height="22" fill="#b9c99f"/><rect x="570" y="206" width="102" height="22" fill="#d6f66b"/><path d="M560 194v79" stroke="#354935" stroke-width="2"/><path d="M468 251v8" stroke="#849766" stroke-width="2"/><path d="M475 248v14" stroke="#849766" stroke-width="2"/><path d="M482 245v20" stroke="#849766" stroke-width="2"/><path d="M489 242v26" stroke="#849766" stroke-width="2"/><path d="M496 239v32" stroke="#849766" stroke-width="2"/><path d="M503 251v8" stroke="#849766" stroke-width="2"/><path d="M510 248v14" stroke="#849766" stroke-width="2"/><path d="M517 245v20" stroke="#849766" stroke-width="2"/><path d="M524 242v26" stroke="#849766" stroke-width="2"/><path d="M531 239v32" stroke="#849766" stroke-width="2"/><path d="M538 251v8" stroke="#849766" stroke-width="2"/><path d="M545 248v14" stroke="#849766" stroke-width="2"/><path d="M552 245v20" stroke="#849766" stroke-width="2"/><path d="M559 242v26" stroke="#849766" stroke-width="2"/><path d="M566 239v32" stroke="#849766" stroke-width="2"/><path d="M573 251v8" stroke="#849766" stroke-width="2"/><path d="M580 248v14" stroke="#849766" stroke-width="2"/><path d="M587 245v20" stroke="#849766" stroke-width="2"/><path d="M594 242v26" stroke="#849766" stroke-width="2"/><path d="M601 239v32" stroke="#849766" stroke-width="2"/><path d="M608 251v8" stroke="#849766" stroke-width="2"/><path d="M615 248v14" stroke="#849766" stroke-width="2"/><path d="M622 245v20" stroke="#849766" stroke-width="2"/><path d="M629 242v26" stroke="#849766" stroke-width="2"/><path d="M636 239v32" stroke="#849766" stroke-width="2"/><path d="M643 251v8" stroke="#849766" stroke-width="2"/><path d="M650 248v14" stroke="#849766" stroke-width="2"/><path d="M657 245v20" stroke="#849766" stroke-width="2"/><path d="M664 242v26" stroke="#849766" stroke-width="2"/><path d="M671 239v32" stroke="#849766" stroke-width="2"/><path d="M678 251v8" stroke="#849766" stroke-width="2"/><path d="M685 248v14" stroke="#849766" stroke-width="2"/><path d="M692 245v20" stroke="#849766" stroke-width="2"/><path d="M699 242v26" stroke="#849766" stroke-width="2"/><path d="M706 239v32" stroke="#849766" stroke-width="2"/><path d="M713 251v8" stroke="#849766" stroke-width="2"/><path d="M720 248v14" stroke="#849766" stroke-width="2"/><text x="466" y="326" font-size="25" class="" font-weight="700" letter-spacing="-.8">Keep what matters.</text><text x="466" y="364" font-size="18" class="muted" >Cuts + captions + audio.</text></g><g class="step three"><rect x="816" y="134" width="344" height="270" rx="8" fill="#e7e9df" stroke="#d8dbcf"/><text x="842" y="174" font-size="14" class="mono muted" >03 / REVIEW</text><rect x="842" y="201" width="286" height="76" rx="7" fill="#354935"/><path d="M871 231l12 12 23-27" fill="none" stroke="#d6f66b" stroke-width="3"/><text x="923" y="235" font-size="20" class="paper" font-weight="600">8–15 seconds</text><text x="923" y="258" font-size="13" class="paper" >Review pacing + clarity</text><text x="842" y="326" font-size="25" class="" font-weight="700" letter-spacing="-.8">See the first cut.</text><text x="842" y="364" font-size="18" class="muted" >A representative sample.</text></g><g class="step four"><rect x="1192" y="134" width="344" height="270" rx="8" fill="#e7e9df" stroke="#d8dbcf"/><text x="1218" y="174" font-size="14" class="mono muted" >04 / EXPORT</text><path d="M1234 196h49l19 19v65h-68z" fill="#f4f3ed" stroke="#aebc9b"/><path d="M1283 196v19h19" fill="none" stroke="#aebc9b"/><text x="1244" y="261" font-size="14" class="mono" font-weight="700">MP4</text><path d="M1338 238h113m-14-14 14 14-14 14" stroke="#354935" stroke-width="2" fill="none"/><text x="1218" y="326" font-size="25" class="" font-weight="700" letter-spacing="-.8">Finish the story.</text><text x="1218" y="364" font-size="18" class="muted" >Checked MP4 + project.</text></g>
</svg>
