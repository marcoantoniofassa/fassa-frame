<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;overflow:hidden;background:var(--ink-900)}.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}</style></head><body><div id="root"></div>
<script type="text/babel">
// Local SVG masks need http(s); from file:// the bundle falls back to the same Lucide 0.460.0 set on unpkg.
if(location.protocol!=='file:')window.EDITONNY_ICON_BASE='../../../assets/icons/';
const { SiteHeader, LanguageSelect, CreatorChip, Highlight, Chip, Button } = window.EditonnyDesignSystem_f6f5bd;
function Demo(){const [lang,setLang]=React.useState('pt-BR');const [f,setF]=React.useState(0);const [ch,setCh]=React.useState(1);
return <div>
<SiteHeader fixed={false} active="#demo" links={[{label:'Demonstração',href:'#demo'},{label:'Recursos',href:'#recursos'},{label:'Biblioteca',href:'#biblioteca'}]} style={{padding:0,marginBottom:18}}
 right={<><LanguageSelect value={lang} onChange={setLang} flagBase="../../../assets/flags/"/><Button variant="primary" size="sm" icon="github">Acessar skill</Button></>}/>
<div style={{display:'flex',gap:20,alignItems:'center',marginBottom:16}}>
<CreatorChip name="Matheus Gomes" role="Criador" status="100% grátis · open source" photo="../../../assets/imagery/matheus-gomes.jpeg"/>
<h2 style={{margin:0,font:'800 34px/.95 var(--font-display)',letterSpacing:'-0.05em',color:'var(--fog-50)'}}>Cada pedido é <Highlight>uma camada.</Highlight></h2></div>
<div className="r"><h3 style={{margin:0,font:'800 24px/1 var(--font-display)',letterSpacing:'-0.04em',color:'var(--fog-50)'}}>Uma ideia. <Highlight tone="volt">Muitas formas.</Highlight></h3><h3 style={{margin:0,font:'800 24px/1 var(--font-display)',letterSpacing:'-0.04em',color:'var(--fog-50)'}}>Por <Highlight tone="white" nowrap>R$ 0</Highlight></h3></div>
<div className="r">{['Todos','Educação','Vendas','Profissões'].map((l,i)=><Chip key={l} size="sm" selected={f===i} count={[54,12,9,14][i]} onClick={()=>setF(i)}>{l}</Chip>)}</div>
<div className="r">{['Bruto','01 Pausas','02 Legendas','03 Motion'].map((l,i)=><Chip key={l} tone="orange" selected={ch===i} onClick={()=>setCh(i)}>{l}</Chip>)}<Chip tone="sun" selected font="var(--font-caption-impact)">IMPACTO</Chip><Chip tone="sun" font="var(--font-caption-hand)">Manuscrita</Chip></div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
