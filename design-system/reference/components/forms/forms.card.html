<!-- @dsCard group="Components" viewport="700x420" name="Forms" subtitle="TextField, Select, ChoiceCard, Switch, SegmentedControl" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:22px;overflow:hidden}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.g{display:grid;gap:12px}</style></head><body><div id="root"></div>
<script type="text/babel">
const DS = window.EditonnyDesignSystem_f6f5bd;
const { TextField, Select, ChoiceCard, Switch, SegmentedControl } = DS;
function Demo(){const [t,setT]=React.useState("Estilo");const [f,setF]=React.useState("Reels");const [r,setR]=React.useState("1080p");const [a,setA]=React.useState("claude");const [on,setOn]=React.useState(true);const [h,setH]=React.useState("Ninguém te contou isso");return <div className="g">
<div className="r" style={{marginBottom:0}}><SegmentedControl options={["Corte",{value:"Estilo",label:"Estilo",dot:true},"Final"]} value={t} onChange={setT}/><SegmentedControl tone="solid" size="sm" options={["Trending","Reels","Story","TikTok"]} value={f} onChange={setF}/></div>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}><TextField label="Texto do gancho" counter={40} value={h} onChange={e=>setH(e.target.value)}/><Select label="Formato" options={["9:16 (vertical)","16:9 (horizontal)","1:1 (quadrado)"]}/></div>
<div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>{["720p","1080p","4k"].map(x=><ChoiceCard key={x} compact title={x} selected={r===x} onSelect={()=>setR(x)}/>)}</div>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}><ChoiceCard icon="terminal" title="Codex" description="$editonny" selected={a==="codex"} onSelect={()=>setA("codex")}/><ChoiceCard icon="sparkles" title="Claude Code" description="/editonny" selected={a==="claude"} onSelect={()=>setA("claude")}/><Switch label="Legendas" description="Sem som" checked={on} onChange={setOn}/></div>
</div>}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script></body></html>
