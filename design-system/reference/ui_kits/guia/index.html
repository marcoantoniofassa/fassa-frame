<script type="text/babel" data-source="Header.jsx">
(() => {
const { Wordmark, Icon, Button } = window.EditonnyDesignSystem_f6f5bd;

function GuiaHeader({ page, go }) {
  const [scrolled, setScrolled] = React.useState(false);
  React.useEffect(() => {
    const f = () => setScrolled(window.scrollY > 24);
    f(); window.addEventListener('scroll', f, { passive: true });
    return () => window.removeEventListener('scroll', f);
  }, []);
  const items = [['inicio', 'Início'], ['criar', 'Criar prompt'], ['catalogo', 'Catálogo'], ['exemplos', 'Exemplos']];
  return (
    <header style={{ position: 'sticky', top: 0, zIndex: 50, padding: scrolled ? '10px 24px' : '18px 24px', transition: 'padding var(--dur-base) var(--ease-out)' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16, maxWidth: 1360, margin: '0 auto', padding: '8px 8px 8px 20px', background: scrolled ? 'rgba(11,11,13,.72)' : 'transparent', border: '1px solid ' + (scrolled ? 'var(--line-2)' : 'transparent'), borderRadius: 999, backdropFilter: scrolled ? 'blur(20px) saturate(1.4)' : 'none', WebkitBackdropFilter: scrolled ? 'blur(20px) saturate(1.4)' : 'none', boxShadow: scrolled ? '0 20px 50px rgba(0,0,0,.45)' : 'none', transition: 'all var(--dur-base) var(--ease-out)' }}>
        <a href="#" onClick={e => { e.preventDefault(); go('inicio'); }} style={{ textDecoration: 'none' }}><Wordmark size={24} /></a>
        <nav style={{ display: 'flex', gap: 4 }}>
          {items.map(([k, l]) => {
            const on = page === k;
            return <button key={k} onClick={() => go(k)} style={{ position: 'relative', height: 40, padding: '0 16px', font: '700 14px var(--font-sans)', color: on ? 'var(--fog-50)' : 'var(--fog-400)', background: on ? 'var(--glass-12)' : 'transparent', border: 0, borderRadius: 999, cursor: 'pointer', transition: 'color var(--dur-fast), background var(--dur-fast)' }}>{l}{on && <span style={{ position: 'absolute', left: '50%', bottom: 5, width: 4, height: 4, marginLeft: -2, borderRadius: '50%', background: 'var(--orange-500)' }} />}</button>;
          })}
        </nav>
        <Button size="sm" variant={page === 'instalacao' ? 'volt' : 'primary'} iconRight="arrow-up-right" onClick={() => go('instalacao')}>Instalar</Button>
      </div>
    </header>
  );
}
window.GuiaHeader = GuiaHeader;
})();

</script>
<script type="text/babel" data-source="Hero.jsx">

<script type="text/babel" data-source="Home.jsx">
(() => {
const { Button, Eyebrow, StepItem, PromptCard, Card, Marquee, Counter, Reveal, Waveform, KineticCaption, SceneCard, Timeline, Icon, Badge } = window.EditonnyDesignSystem_f6f5bd;

const H2 = ({ children, style }) => <h2 style={{ margin: 0, font: '800 clamp(44px, 5vw, 72px)/0.95 var(--font-display)', letterSpacing: '-0.055em', ...style }}>{children}</h2>;
const Box = ({ children, c = 'var(--orange-500)' }) => <span style={{ background: c, color: 'var(--ink-950)', padding: '0 .12em', borderRadius: '.1em' }}>{children}</span>;

function CutDemo() {
  const [cut, setCut] = React.useState(false);
  React.useEffect(() => { const id = setInterval(() => setCut(v => !v), 2200); return () => clearInterval(id); }, []);
  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 12, font: '700 11px var(--font-mono)', letterSpacing: '.12em' }}>
        <span style={{ color: 'var(--text-2)' }}>BRUTO · 01:12</span>
        <span style={{ color: cut ? 'var(--volt-400)' : 'var(--text-3)', transition: 'color var(--dur-base)' }}>{cut ? 'CORTE · 00:45 ✓' : 'ANALISANDO PAUSAS…'}</span>
      </div>
      <Waveform bars={64} height={86} cuts={cut ? [[0.12, 0.19], [0.38, 0.44], [0.63, 0.7], [0.86, 0.9]] : []} />
    </div>
  );
}

function FormatDemo() {
  const labels = ['9:16', '1:1', '16:9'];
  const [i, setI] = React.useState(0);
  React.useEffect(() => { const id = setInterval(() => setI(v => (v + 1) % 3), 1500); return () => clearInterval(id); }, []);
  const dims = [[64, 112], [96, 96], [140, 80]];
  return (
    <div style={{ height: 130, display: 'grid', placeItems: 'center' }}>
      <div style={{ width: dims[i][0], height: dims[i][1], display: 'grid', placeItems: 'center', background: 'var(--fog-50)', color: 'var(--ink-950)', borderRadius: 14, font: '400 26px var(--font-kinetic)', transition: 'width var(--dur-slow) var(--ease-spring), height var(--dur-slow) var(--ease-spring)' }}>{labels[i]}</div>
    </div>
  );
}

function ReviewDemo() {
  const [t, setT] = React.useState(3);
  React.useEffect(() => { const id = setInterval(() => setT(v => (v + 0.15 > 45 ? 0 : v + 0.15)), 100); return () => clearInterval(id); }, []);
  return <Timeline duration={45} playhead={t} playing segments={[{ start: 0, end: 8, beat: 'Gancho', quote: 'Ninguém te contou' }, { start: 8, end: 26, beat: 'Passos', quote: '94 graus' }, { start: 26, end: 45, beat: 'Chamada', quote: 'Salva aí' }]} marks={[{ start: 30, end: 35 }]} />;
}

const Tile = ({ span, row, children, ...p }) => <Card spotlight lift padding={28} radius="2xl" {...p} style={{ gridColumn: 'span ' + span, gridRow: row ? 'span ' + row : undefined, display: 'flex', flexDirection: 'column', justifyContent: 'space-between', gap: 24, minHeight: 280, ...(p.style || {}) }}>{children}</Card>;
const TileHead = ({ k, t, d, dark }) => (
  <div>
    <div style={{ font: '700 11px var(--font-mono)', letterSpacing: '.16em', marginBottom: 12, color: dark ? 'rgba(5,5,6,.6)' : 'var(--orange-500)' }}>{k}</div>
    <div style={{ font: '800 30px/1 var(--font-display)', letterSpacing: '-0.045em', marginBottom: 8 }}>{t}</div>
    <div style={{ font: '500 14.5px/1.5 var(--font-sans)', color: dark ? 'rgba(5,5,6,.72)' : 'var(--text-2)', maxWidth: 380 }}>{d}</div>
  </div>
);

function Home({ go }) {
  return (
    <div>
      <Hero go={go} />
      <div style={{ position: 'relative', height: 210, overflow: 'hidden', margin: '0 0 40px' }}>
        <Marquee tone="orange" size={58} rotate={-3} speed={34} items={['Corte seco', 'Legendas palavra a palavra', 'Motion', 'Trilha sob medida', 'Ruído zero', '145 cenas']} style={{ position: 'absolute', left: -40, right: -40, top: 30 }} />
        <Marquee tone="volt" size={40} reverse rotate={2.5} speed={28} items={['9:16', '16:9', '1:1', '4:5', 'Claude Code', 'Codex', '100% local']} style={{ position: 'absolute', left: -40, right: -40, top: 118 }} />
      </div>

      <section style={{ maxWidth: 1360, margin: '0 auto', padding: '40px 56px 100px' }}>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, minmax(0,1fr))', gap: 16 }}>
          {[[145, '', 'cenas de motion no catálogo', 'var(--orange-500)'], [54, '', 'pedidos prontos para adaptar', 'var(--fog-50)'], [4, '', 'formatos: vertical, quadrado, feed, horizontal', 'var(--fog-50)'], [100, '%', 'local. Nada sobe para a nuvem por aqui.', 'var(--volt-400)']].map(([v, s, l, c], i) => (
            <Reveal key={i} delay={i * 90}>
              <div style={{ padding: '26px 0', borderTop: '2px solid ' + (i === 0 ? 'var(--orange-500)' : 'var(--line-2)') }}>
                <div style={{ font: '400 clamp(64px, 7vw, 108px)/0.9 var(--font-kinetic)', color: c }}><Counter value={v} suffix={s} /></div>
                <div style={{ marginTop: 10, font: '600 14px/1.45 var(--font-sans)', color: 'var(--text-2)', maxWidth: 220 }}>{l}</div>
              </div>
            </Reveal>
          ))}
        </div>
      </section>

      <section style={{ maxWidth: 1360, margin: '0 auto', padding: '0 56px 110px' }}>
        <Reveal><div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', gap: 40, marginBottom: 44 }}>
          <div><Eyebrow index="01" style={{ marginBottom: 22 }}>Tudo em um fluxo</Eyebrow><H2>Tudo que um editor faz.<br /><span style={{ color: 'var(--fog-400)' }}>Em uma</span> <Box>conversa.</Box></H2></div>
          <p style={{ maxWidth: 340, margin: 0, font: '500 16px/1.55 var(--font-sans)', color: 'var(--text-2)' }}>Editor e Motion trabalham juntos no seu computador. Você revisa uma amostra antes de finalizar o vídeo inteiro.</p>
        </div></Reveal>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, minmax(0,1fr))', gap: 16 }}>
          <Tile span={7}><TileHead k="EDITOR / CORTE" t="Corte com intenção." d="Tira pausas, repetições e erros sem perder palavras nem o sentido da fala." /><CutDemo /></Tile>
          <Tile span={5} variant="orange"><TileHead dark k="LEGENDAS" t="Cada palavra, no tempo." d="Legendas palavra a palavra, pensadas para quem assiste sem som." /><div style={{ padding: '18px 10px', background: 'var(--ink-950)', borderRadius: 20 }}><KineticCaption text="Pare de perder quem assiste sem som" size={26} highlight="var(--orange-500)" /></div></Tile>
          <Tile span={4} padding={10} style={{ minHeight: 0 }}><SceneCard group="Universais" name="Dinheiro subindo" motif="contador" bg="black" autoplay when="Motion que explica: números, passos, comparações." style={{ background: 'transparent', border: 0 }} /></Tile>
          <Tile span={4}><TileHead k="FORMATOS" t="Um vídeo, todo lugar." d="Reels, Stories, feed e YouTube a partir do mesmo material." /><FormatDemo /></Tile>
          <Tile span={4} variant="volt"><TileHead dark k="SOM" t="Voz limpa. Trilha certa." d="Ruído de fundo fora, trilha com o clima do vídeo." /><Waveform bars={36} height={70} color="var(--ink-950)" /></Tile>
          <Tile span={12} style={{ minHeight: 0, display: 'grid', gridTemplateColumns: 'minmax(0,.7fr) minmax(0,1.3fr)', alignItems: 'center' }}><TileHead k="REVISÃO" t="Você aprova antes do final." d="O preview abre no navegador: marque o trecho, diga o que mudar, aprove. A IA renderiza de novo." /><ReviewDemo /></Tile>
        </div>
      </section>

      <section style={{ maxWidth: 1360, margin: '0 auto', padding: '0 56px 110px', display: 'grid', gridTemplateColumns: 'minmax(0,1fr) minmax(0,1.1fr)', gap: 72 }}>
        <Reveal><div style={{ position: 'sticky', top: 120 }}><Eyebrow index="02" style={{ marginBottom: 22 }}>Como funciona</Eyebrow><H2>Menos operações.<br /><Box c="var(--volt-400)">Mais direção.</Box></H2><p style={{ maxWidth: 380, margin: '24px 0 30px', font: '500 16px/1.6 var(--font-sans)', color: 'var(--text-2)' }}>Este guia prepara o pedido. A edição acontece no seu computador, com sua IA e o pacote instalado.</p><Button variant="outline" iconRight="arrow-up-right" onClick={() => go('criar')}>Montar meu pedido</Button></div></Reveal>
        <div>
          {[['01', 'Conte o que quer dizer', 'Escolha o objetivo, indique a pasta dos vídeos e defina o tom. Não precisa conhecer uma timeline.'], ['02', 'Acerte o primeiro corte', 'A IA confere o ambiente, trabalha o corte e prepara uma amostra de 8–15 segundos. Você avalia o ritmo e o visual.'], ['03', 'Dê o acabamento', 'Legendas, som e motion ajudam a contar a história. Depois da sua revisão, a IA finaliza e verifica o arquivo.']].map(([n, t, d], i) => <Reveal key={n} delay={i * 110}><StepItem number={n} title={t} last={i === 2}>{d}</StepItem></Reveal>)}
        </div>
      </section>

      <section style={{ maxWidth: 1360, margin: '0 auto', padding: '0 56px 110px' }}>
        <Reveal><div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: 36 }}><div><Eyebrow index="03" style={{ marginBottom: 22 }}>Um bom ponto de partida</Eyebrow><H2>Comece com uma intenção.</H2></div><Button variant="ghost" iconRight="arrow-up-right" onClick={() => go('exemplos')}>Ver os 54 pedidos</Button></div></Reveal>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0,1fr))', gap: 16 }}>
          {[['Educar', 'Ensinar com clareza', 'Um tutorial direto, com etapas visuais.'], ['Apresentar', 'Apresentar uma ideia', 'Uma história curta que dá vontade de ouvir.'], ['Demonstrar', 'Mostrar a diferença', 'Antes e depois, usando suas provas reais.']].map(([c, t, s], i) => <Reveal key={t} delay={i * 90}><PromptCard index={'0' + (i + 1)} category={c} title={t} summary={s} action="Usar este ponto de partida" onClick={() => go('criar')} style={{ width: '100%', minHeight: 280 }} /></Reveal>)}
        </div>
      </section>

      <section style={{ maxWidth: 1360, margin: '0 auto', padding: '0 56px 80px' }}>
        <Reveal>
          <div className="ed-grain" style={{ position: 'relative', overflow: 'hidden', padding: '72px 64px 64px', background: 'var(--orange-500)', color: 'var(--ink-950)', borderRadius: 40 }}>

<script type="text/babel" data-source="CreatePrompt.jsx">

<script type="text/babel" data-source="Catalog.jsx">
(() => {

  ['Editar', 'Anúncio com uma mensagem clara', 'Gancho, demonstração e chamada com fatos do seu material.'],
  ['Editar', 'Reels de conteúdo', 'Uma ideia completa, com ritmo e sem venda forçada.'],
  ['Editar', 'VSL com momentos visuais', 'Organize a apresentação de venda e ilustre as passagens decisivas.'],
  ['Áudio', 'Limpar a voz', 'Ruído de fundo fora, palavras inteiras dentro.'],
];

function Catalog({ mode, go, toast }) {
  const isScenes = mode === 'catalogo';
  const groups = isScenes ? ['Todas', 'Universais', 'Apontadores', 'Interfaces', 'Efeitos'] : ['Todas', 'Começar', 'Editar', 'Áudio'];

  React.useEffect(() => { setG('Todas'); setQ(''); }, [mode]);
  const list = (isScenes ? CENAS : PEDIDOS).filter(x => (g === 'Todas' || x[isScenes ? 1 : 0] === g) && x.join(' ').toLowerCase().includes(q.toLowerCase()));
  const box = t => <span style={{ background: isScenes ? 'var(--orange-500)' : 'var(--volt-400)', color: 'var(--ink-950)', padding: '0 .12em', borderRadius: '.1em' }}>{t}</span>;
  return (
    <div style={{ maxWidth: 1360, margin: '0 auto', padding: '40px 56px 100px' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', gap: 40, marginBottom: 44 }}>

          <h1 key={mode} style={{ margin: 0, font: '800 clamp(56px, 6.4vw, 100px)/0.92 var(--font-display)', letterSpacing: '-0.06em', animation: 'ed-word-in .8s var(--ease-out) both' }}>{isScenes ? <>Uma ideia.<br />{box('Muitas formas.')}</> : <>Uma intenção.<br />{box('Um bom começo.')}</>}</h1>

      </div>
      <div style={{ display: 'flex', gap: 16, alignItems: 'flex-end', flexWrap: 'wrap', paddingTop: 26, borderTop: '1px solid var(--line-1)', marginBottom: 30 }}>
        <TextField label={isScenes ? 'Buscar cenas' : 'Buscar exemplos e prompts'} placeholder={isScenes ? 'Tente: comparação, título, passos…' : 'Tente: aula, áudio, legendas…'} value={q} onChange={e => setQ(e.target.value)} style={{ flex: '1 1 320px' }} />
        <SegmentedControl tone="solid" options={groups} value={g} onChange={setG} />
        <Badge mono style={{ marginBottom: 12 }}>{list.length} {isScenes ? 'CENAS' : 'PEDIDOS'}</Badge>
      </div>
      <div key={mode + g + q} style={{ display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0,1fr))', gap: 16 }}>
        {list.map((x, i) => (
          <div key={x[0] + x[1]} style={{ animation: 'ed-fade-up .6s var(--ease-out) ' + (i * 60) + 'ms both', display: 'flex' }}>
            {isScenes
              ? <SceneCard name={x[0]} group={x[1]} when={x[2]} motif={x[3]} bg={x[4]} duration={6} onClick={() => setOpen(x)} style={{ width: '100%' }} />
              : <PromptCard index={String(i + 1).padStart(2, '0')} category={x[0]} title={x[1]} summary={x[2]} onClick={() => setOpen(x)} style={{ width: '100%', minHeight: 260 }} />}
          </div>
        ))}
        {!list.length && <p style={{ gridColumn: '1/-1', color: 'var(--text-2)' }}>Nada encontrado. Tente outra palavra.</p>}
      </div>
      <Dialog open={!!open} eyebrow={open && (isScenes ? open[1] : open[0])} title={open && (isScenes ? open[0] : open[1])} onClose={() => setOpen(null)}
        actions={<><Button variant="outline" size="sm" icon="copy" onClick={() => { setOpen(null); toast('Pedido copiado.'); }}>Copiar pedido</Button><Button size="sm" iconRight="arrow-up-right" onClick={() => { setOpen(null); go('criar'); toast(isScenes ? 'Cena adicionada ao seu pedido.' : 'Exemplo aplicado ao briefing.'); }}>{isScenes ? 'Usar no meu pedido' : 'Personalizar pedido'}</Button></>}>
        {open && (isScenes
          ? <>
              <div style={{ marginBottom: 16 }}><SceneCard name={open[0]} group={open[1]} motif={open[3]} bg={open[4]} autoplay duration={6} style={{ width: '100%', pointerEvents: 'none' }} /></div>
              Use {open[2]}.<br /><span style={{ color: 'var(--text-3)', fontSize: 12 }}>Esquema ilustrativo. A composição real é renderizada pelo agente.</span>
            </>
          : open[2])}
      </Dialog>
    </div>
  );
}
window.Catalog = Catalog;
})();

</script>

<script type="text/babel">
const { Toast, Wordmark, Marquee } = window.EditonnyDesignSystem_f6f5bd;
