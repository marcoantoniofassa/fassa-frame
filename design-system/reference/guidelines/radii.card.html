<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px;background:var(--bg-page);overflow:hidden}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px}.chip{height:78px;border-radius:var(--radius-md)}.lb{font:700 12px/1.3 var(--font-sans);margin-top:8px;color:var(--text-1)}.tk{font:600 10.5px/1.4 var(--font-mono);color:var(--text-2)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--ink-700);border-radius:var(--radius-xs)"></div><div class="tk" style="margin-top:6px">xs · 6</div></div><div class="sw"><div class="chip" style="background:var(--ink-700);border-radius:var(--radius-sm)"></div><div class="tk" style="margin-top:6px">sm · 10</div></div><div class="sw"><div class="chip" style="background:var(--ink-700);border-radius:var(--radius-md)"></div><div class="tk" style="margin-top:6px">md · 14</div></div><div class="sw"><div class="chip" style="background:var(--ink-700);border-radius:var(--radius-lg)"></div><div class="tk" style="margin-top:6px">lg · 20</div></div><div class="sw"><div class="chip" style="background:var(--ink-700);border-radius:var(--radius-xl)"></div><div class="tk" style="margin-top:6px">xl · 24</div></div><div class="sw"><div class="chip" style="background:var(--ink-700);border-radius:var(--radius-2xl)"></div><div class="tk" style="margin-top:6px">2xl · 32</div></div><div class="sw"><div class="chip" style="background:var(--ink-700);border-radius:var(--radius-pill)"></div><div class="tk" style="margin-top:6px">pill · 999</div></div></div></body></html>
