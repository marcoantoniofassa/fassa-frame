<!-- @dsCard group="Motion" viewport="700x230" name="Easing curves" subtitle="Ao vivo: expo-out, spring, in-out, snap" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px;background:var(--bg-page);overflow:hidden}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px}.chip{height:78px;border-radius:var(--radius-md)}.lb{font:700 12px/1.3 var(--font-sans);margin-top:8px;color:var(--text-1)}.tk{font:600 10.5px/1.4 var(--font-mono);color:var(--text-2)}@keyframes mv{to{left:calc(100% - 26px)}}</style></head><body><div style="display:grid;gap:12px"><div style="display:grid;grid-template-columns:170px 1fr;align-items:center;gap:14px"><div><div class="lb" style="margin:0">ease-out · expo</div><div class="tk">entradas, reveals</div></div><div style="position:relative;height:30px;background:var(--ink-800);border-radius:999px"><span style="position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--orange-500);animation:mv 1.8s var(--ease-out) infinite alternate"></span></div></div><div style="display:grid;grid-template-columns:170px 1fr;align-items:center;gap:14px"><div><div class="lb" style="margin:0">ease-spring</div><div class="tk">botões, toggles, pop</div></div><div style="position:relative;height:30px;background:var(--ink-800);border-radius:999px"><span style="position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--orange-500);animation:mv 1.8s var(--ease-spring) infinite alternate"></span></div></div><div style="display:grid;grid-template-columns:170px 1fr;align-items:center;gap:14px"><div><div class="lb" style="margin:0">ease-in-out</div><div class="tk">loops, blobs</div></div><div style="position:relative;height:30px;background:var(--ink-800);border-radius:999px"><span style="position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--orange-500);animation:mv 1.8s var(--ease-in-out) infinite alternate"></span></div></div><div style="display:grid;grid-template-columns:170px 1fr;align-items:center;gap:14px"><div><div class="lb" style="margin:0">ease-snap</div><div class="tk">wipes, marca-texto</div></div><div style="position:relative;height:30px;background:var(--ink-800);border-radius:999px"><span style="position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--orange-500);animation:mv 1.8s var(--ease-snap) infinite alternate"></span></div></div></div></body></html>
