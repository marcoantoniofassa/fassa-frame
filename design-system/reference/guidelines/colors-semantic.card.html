<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px;background:var(--bg-page);overflow:hidden}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px}.chip{height:78px;border-radius:var(--radius-md)}.lb{font:700 12px/1.3 var(--font-sans);margin-top:8px;color:var(--text-1)}.tk{font:600 10.5px/1.4 var(--font-mono);color:var(--text-2)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--success);"></div><div class="lb">success · volt</div><div class="tk">--success</div></div><div class="sw"><div class="chip" style="background:var(--warning);"></div><div class="lb">warning · sun</div><div class="tk">--warning</div></div><div class="sw"><div class="chip" style="background:var(--danger);"></div><div class="lb">danger · rec</div><div class="tk">--danger</div></div><div class="sw"><div class="chip" style="background:var(--info);"></div><div class="lb">info · sky</div><div class="tk">--info</div></div><div class="sw"><div class="chip" style="background:var(--accent);"></div><div class="lb">accent · orange</div><div class="tk">--accent</div></div></div></body></html>
