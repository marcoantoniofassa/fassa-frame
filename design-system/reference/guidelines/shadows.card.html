<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px;background:var(--bg-page);overflow:hidden}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px}.chip{height:78px;border-radius:var(--radius-md)}.lb{font:700 12px/1.3 var(--font-sans);margin-top:8px;color:var(--text-1)}.tk{font:600 10.5px/1.4 var(--font-mono);color:var(--text-2)}</style></head><body><div class="row" style="padding:14px 6px"><div class="sw"><div class="chip" style="background:var(--ink-800);box-shadow:var(--shadow-sm)"></div><div class="tk" style="margin-top:12px">shadow-sm</div></div><div class="sw"><div class="chip" style="background:var(--ink-800);box-shadow:var(--shadow-md)"></div><div class="tk" style="margin-top:12px">shadow-md</div></div><div class="sw"><div class="chip" style="background:var(--ink-800);box-shadow:var(--shadow-lg)"></div><div class="tk" style="margin-top:12px">shadow-lg</div></div><div class="sw"><div class="chip" style="background:var(--orange-500);box-shadow:var(--shadow-glow)"></div><div class="tk" style="margin-top:12px">shadow-glow</div></div><div class="sw"><div class="chip" style="background:var(--volt-400);box-shadow:var(--shadow-glow-volt)"></div><div class="tk" style="margin-top:12px">shadow-glow-volt</div></div></div></body></html>
