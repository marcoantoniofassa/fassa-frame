<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px;background:var(--bg-page);overflow:hidden}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px}.chip{height:78px;border-radius:var(--radius-md)}.lb{font:700 12px/1.3 var(--font-sans);margin-top:8px;color:var(--text-1)}.tk{font:600 10.5px/1.4 var(--font-mono);color:var(--text-2)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--orange-50);"></div><div class="lb">50</div><div class="tk">--orange-50</div></div><div class="sw"><div class="chip" style="background:var(--orange-100);"></div><div class="lb">100</div><div class="tk">--orange-100</div></div><div class="sw"><div class="chip" style="background:var(--orange-300);"></div><div class="lb">300 · hover</div><div class="tk">--orange-300</div></div><div class="sw"><div class="chip" style="background:var(--orange-500);"></div><div class="lb">500 · accent</div><div class="tk">--orange-500</div></div><div class="sw"><div class="chip" style="background:var(--orange-600);"></div><div class="lb">600</div><div class="tk">--orange-600</div></div><div class="sw"><div class="chip" style="background:var(--orange-700);"></div><div class="lb">700</div><div class="tk">--orange-700</div></div><div class="sw"><div class="chip" style="background:var(--orange-800);border:1px solid var(--line-2)"></div><div class="lb">800</div><div class="tk">--orange-800</div></div><div class="sw"><div class="chip" style="background:var(--orange-900);border:1px solid var(--line-2)"></div><div class="lb">900</div><div class="tk">--orange-900</div></div></div></body></html>
