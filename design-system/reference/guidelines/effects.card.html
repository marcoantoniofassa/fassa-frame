<!-- @dsCard group="Motion" viewport="700x230" name="Effects" subtitle="Beam border, spotlight, grain, texto em brilho" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px;background:var(--bg-page);overflow:hidden}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px}.chip{height:78px;border-radius:var(--radius-md)}.lb{font:700 12px/1.3 var(--font-sans);margin-top:8px;color:var(--text-1)}.tk{font:600 10.5px/1.4 var(--font-mono);color:var(--text-2)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;height:186px"><div style="position:relative;padding:1px;border-radius:22px;background:var(--line-2);overflow:hidden"><i style="position:absolute;left:50%;top:50%;width:600px;height:600px;margin:-300px;background:var(--grad-beam);animation:ed-spin 4s linear infinite"></i><div style="position:relative;height:100%;border-radius:21px;background:var(--ink-800);display:grid;place-items:center" class="tk">beam</div></div><div style="border-radius:22px;background:radial-gradient(160px circle at 35% 30%,rgba(255,79,18,.35),transparent 60%),var(--ink-800);display:grid;place-items:center" class="tk">spotlight</div><div class="ed-grain" style="border-radius:22px;overflow:hidden;background:var(--orange-500);display:grid;place-items:center;font:400 28px var(--font-kinetic);color:var(--ink-950)">GRAIN</div><div style="border-radius:22px;background:var(--ink-800);display:grid;place-items:center"><span class="ed-text-fire" style="font:400 44px/1 var(--font-kinetic)">FIRE</span></div></div></body></html>
