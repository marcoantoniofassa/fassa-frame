<!-- @dsCard group="Motion" viewport="700x150" name="Durations" subtitle="120 → 1200ms; stagger 70ms" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px;background:var(--bg-page);overflow:hidden}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px}.chip{height:78px;border-radius:var(--radius-md)}.lb{font:700 12px/1.3 var(--font-sans);margin-top:8px;color:var(--text-1)}.tk{font:600 10.5px/1.4 var(--font-mono);color:var(--text-2)}</style></head><body><div class="row"><div class="sw" style="background:var(--ink-800);border-radius:var(--radius-md);padding:14px"><div style="font:400 26px/1 var(--font-kinetic);color:var(--orange-500)">120ms</div><div class="tk" style="margin-top:6px">--dur-instant</div></div><div class="sw" style="background:var(--ink-800);border-radius:var(--radius-md);padding:14px"><div style="font:400 26px/1 var(--font-kinetic);color:var(--orange-500)">200ms</div><div class="tk" style="margin-top:6px">--dur-fast</div></div><div class="sw" style="background:var(--ink-800);border-radius:var(--radius-md);padding:14px"><div style="font:400 26px/1 var(--font-kinetic);color:var(--orange-500)">320ms</div><div class="tk" style="margin-top:6px">--dur-base</div></div><div class="sw" style="background:var(--ink-800);border-radius:var(--radius-md);padding:14px"><div style="font:400 26px/1 var(--font-kinetic);color:var(--orange-500)">600ms</div><div class="tk" style="margin-top:6px">--dur-slow</div></div><div class="sw" style="background:var(--ink-800);border-radius:var(--radius-md);padding:14px"><div style="font:400 26px/1 var(--font-kinetic);color:var(--orange-500)">1200ms</div><div class="tk" style="margin-top:6px">--dur-cinematic</div></div><div class="sw" style="background:var(--ink-800);border-radius:var(--radius-md);padding:14px"><div style="font:400 26px/1 var(--font-kinetic);color:var(--orange-500)">70ms</div><div class="tk" style="margin-top:6px">--stagger</div></div></div></body></html>
