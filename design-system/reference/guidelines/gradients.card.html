<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px;background:var(--bg-page);overflow:hidden}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px}.chip{height:78px;border-radius:var(--radius-md)}.lb{font:700 12px/1.3 var(--font-sans);margin-top:8px;color:var(--text-1)}.tk{font:600 10.5px/1.4 var(--font-mono);color:var(--text-2)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="height:130px;background-image:var(--grad-fire)"></div><div class="tk" style="margin-top:6px">grad-fire</div></div><div class="sw"><div class="chip" style="height:130px;background-color:var(--ink-950);background-image:var(--grad-aurora)"></div><div class="tk" style="margin-top:6px">grad-aurora</div></div><div class="sw"><div class="chip" style="height:130px;background-image:var(--grad-text)"></div><div class="tk" style="margin-top:6px">grad-text</div></div><div class="sw"><div class="chip" style="height:130px;background-color:#333;background-image:var(--grad-protect)"></div><div class="tk" style="margin-top:6px">grad-protect</div></div></div></body></html>
